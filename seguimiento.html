<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Seguimiento y Control (Alianzas)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
        .card-semaforo { border-left: 5px solid; cursor: pointer; transition: transform 0.2s; }
        .card-semaforo:hover { transform: scale(1.02); }
        .verde { border-left-color: #198754; }
        .amarillo { border-left-color: #ffc107; }
        .rojo { border-left-color: #dc3545; }
        .negro { border-left-color: #212529; }
        .timeline { list-style: none; padding-left: 0; }
        .timeline li { position: relative; padding-left: 30px; margin-bottom: 20px; }
        .timeline li::before { content: ''; position: absolute; left: 0; top: 0; width: 15px; height: 15px; border-radius: 50%; background-color: #0d1b5e; }
        .timeline li::after { content: ''; position: absolute; left: 7px; top: 15px; bottom: -20px; width: 2px; background-color: #dee2e6; }
        .timeline li:last-child::after { display: none; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-truck me-2"></i>IPOSTEL - Control de Alianzas</a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" onclick="buscarPaqueteUniversal()">
                    <i class="bi bi-search"></i> Buscar Paquete
                </button>
                <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="abrirEnlaceMRW()">
                    <i class="bi bi-link-45deg"></i> Enlazar Guías MRW
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- Tarjetas de Resumen -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-semaforo verde shadow-sm p-3">
                    <h6 class="text-muted mb-1">Masters OK</h6>
                    <h3 class="mb-0 fw-bold" id="countOK">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo amarillo shadow-sm p-3">
                    <h6 class="text-muted mb-1">En Retraso</h6>
                    <h3 class="mb-0 fw-bold" id="countRetraso">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo rojo shadow-sm p-3">
                    <h6 class="text-muted mb-1">Críticos</h6>
                    <h3 class="mb-0 fw-bold" id="countCritico">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo negro shadow-sm p-3">
                    <h6 class="text-muted mb-1">Extraviados</h6>
                    <h3 class="mb-0 fw-bold" id="countExtraviado">0</h3>
                </div>
            </div>
        </div>

        <!-- Tabla de Masters -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-ul me-2"></i>Tracking de Masters</h5>
                <button class="btn btn-primary btn-sm" onclick="cargarMasters()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Master</th>
                                <th>Origen -> Destino</th>
                                <th>Piezas</th>
                                <th>Guía MRW</th>
                                <th>Estatus</th>
                                <th>Alerta</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMasters">
                            <tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Timeline y Registro de Hito -->
    <div class="modal fade" id="modalTimeline" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Timeline del Master: <span id="modalIdMaster" class="text-primary"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 border-end">
                            <h6 class="fw-bold mb-3"><i class="bi bi-clock-history"></i> Historial de Hitos</h6>
                            <ul class="timeline" id="listaTimeline">
                                <li class="text-muted">Cargando historial...</li>
                            </ul>
                        </div>
                        <div class="col-md-6">
                            <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> Registrar Nuevo Hito</h6>
                            <form id="formHito">
                                <input type="hidden" id="hitoIdMaster">
                                <div class="mb-3">
                                    <label class="form-label">Hito a registrar</label>
                                    <select class="form-select" id="selectHito" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Entregado_MRW">📦 Entregado a MRW</option>
                                        <option value="En_Transito">🛣️ En Tránsito Nacional</option>
                                        <option value="Llegada_Destino">🏢 Llegada a Destino</option>
                                        <option value="Entregado">✅ Entrega Final</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Observaciones</label>
                                    <textarea class="form-control" id="obsHito" rows="3" placeholder="Opcional..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Guardar Hito</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';
        let modalTimeline;
        const sesion = { usuario: '', rol: '' };

        document.addEventListener('DOMContentLoaded', () => {
            // Validación de sesión básica
            const urlParams = new URLSearchParams(window.location.search);
            sesion.usuario = urlParams.get('u') || sessionStorage.getItem('ipostel_usuario') || '';
            sesion.rol = (urlParams.get('rol') || sessionStorage.getItem('ipostel_rol') || '').toUpperCase();

            if (!sesion.usuario || sesion.rol !== 'COORD_ALIANZA') {
                Swal.fire('Acceso Restringido', 'Debe iniciar sesión como Coordinador de Alianzas.', 'warning')
                    .then(() => window.location.href = 'index.html');
                return;
            }

            cargarMasters();
            modalTimeline = new bootstrap.Modal(document.getElementById('modalTimeline'));
            
            // Evento para guardar el hito
            document.getElementById('formHito').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerHTML = 'Guardando...';

                try {
                    const resp = await postAPI({
                        accion: 'registrarHito',
                        idMaster: document.getElementById('hitoIdMaster').value,
                        hito: document.getElementById('selectHito').value,
                        observaciones: document.getElementById('obsHito').value
                    });

                    if (resp.exito) {
                        Swal.fire('¡Guardado!', 'El hito ha sido registrado.', 'success');
                        document.getElementById('formHito').reset();
                        cargarMasters();
                        abrirTimeline(document.getElementById('hitoIdMaster').value);
                    } else {
                        Swal.fire('Error', resp.mensaje, 'error');
                    }
                } catch (error) {
                    Swal.fire('Error de conexión', 'No se pudo conectar.', 'error');
                }
                
                btn.disabled = false;
                btn.innerHTML = 'Guardar Hito';
            });
        });

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ==========================================
        // BUSCADOR UNIVERSAL DE PAQUETES
        // ==========================================
        function buscarPaqueteUniversal() {
            Swal.fire({
                title: '🔍 Rastreador de Paquetes',
                input: 'text',
                inputLabel: 'Ingrese el código de seguimiento o ID Master',
                inputPlaceholder: 'Ej: H51D8 o MST-XXXXX',
                showCancelButton: true,
                confirmButtonText: 'Buscar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#0d1b5e',
                inputAttributes: { autocapitalize: 'off', autocomplete: 'off' }
            }).then(r => {
                if (r.isConfirmed && r.value) {
                    Swal.fire({ title: 'Buscando en el sistema...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    postAPI({ accion: 'buscarPaquete', codigo: r.value.trim() }).then(resp => {
                        Swal.close();
                        if (resp.exito && resp.paquete) {
                            const p = resp.paquete;
                            let badgeRecepcion = 'bg-secondary';
                            if (p.estatusRecepcion === 'Pendiente_Recepcion') badgeRecepcion = 'bg-warning text-dark';
                            else if (p.estatusRecepcion === 'En_Custodia') badgeRecepcion = 'bg-primary';
                            else if (p.estatusRecepcion === 'Entregado') badgeRecepcion = 'bg-success';
                            else if (p.estatusRecepcion === 'Extraviado' || p.estatusRecepcion === 'Retrasado') badgeRecepcion = 'bg-danger';

                            Swal.fire({
                                title: '📦 Resultados: ' + p.codigo,
                                html: `
                                    <div class="text-start bg-light p-3 rounded">
                                        <div class="row g-2">
                                            <div class="col-6"><small class="text-muted">Estado General:</small><br><span class="badge bg-info text-dark">${p.estatusGeneral}</span></div>
                                            <div class="col-6"><small class="text-muted">Estado en OPT:</small><br><span class="badge ${badgeRecepcion}">${p.estatusRecepcion}</span></div>
                                            <div class="col-12"><small class="text-muted">OPT Destino:</small><br><b>${p.optDestino}</b></div>
                                            <hr class="my-2">
                                            <div class="col-6"><small class="text-muted">Origen:</small><br>${p.origen}</div>
                                            <div class="col-6"><small class="text-muted">Destino:</small><br>${p.destino}</div>
                                            <div class="col-4"><small class="text-muted">Piezas:</small><br><b>${p.piezas}</b></div>
                                            <div class="col-8"><small class="text-muted">Guía MRW:</small><br>${p.guiaMrw}</div>
                                        </div>
                                    </div>
                                `,
                                icon: 'success',
                                confirmButtonColor: '#0d1b5e',
                                width: '600px'
                            });
                        } else {
                            Swal.fire('No encontrado', resp.mensaje || 'El código no existe en el sistema.', 'warning');
                        }
                    }).catch(() => {
                        Swal.close();
                        Swal.fire('Error de conexión', 'No se pudo comunicar con el servidor.', 'error');
                    });
                }
            });
        }

        async function cargarMasters() {
            const tbody = document.getElementById('tablaMasters');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>';

            try {
                const data = await postAPI({ accion: 'obtenerMasters' });

                if (data.exito) {
                    tbody.innerHTML = '';
                    let conteo = { OK: 0, RETRASO: 0, CRITICO: 0, EXTRAVIADO: 0 };

                    if (data.masters.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay Masters registrados en el sistema aún.</td></tr>';
                        return;
                    }

                    data.masters.forEach(m => {
                        if (m.alerta && conteo.hasOwnProperty(m.alerta)) conteo[m.alerta]++;
                        
                        let badgeClass = m.alerta === 'OK' ? 'bg-success' : 
                                         m.alerta === 'RETRASO' ? 'bg-warning text-dark' : 
                                         m.alerta === 'CRITICO' ? 'bg-danger' : 'bg-dark';

                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${m.id}</td>
                                <td>${m.origen} <i class="bi bi-arrow-right"></i> ${m.destino}</td>
                                <td>${m.piezas}</td>
                                <td>${m.guiaMrw || '<span class="text-muted small">Sin enlazar</span>'}</td>
                                <td><span class="badge bg-secondary">${m.estatus}</span></td>
                                <td><span class="badge ${badgeClass}">${m.alerta || 'N/A'}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="abrirTimeline('${m.id}')">
                                        <i class="bi bi-clock-history"></i> Ver / Actualizar
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    document.getElementById('countOK').textContent = conteo.OK;
                    document.getElementById('countRetraso').textContent = conteo.RETRASO;
                    document.getElementById('countCritico').textContent = conteo.CRITICO;
                    document.getElementById('countExtraviado').textContent = conteo.EXTRAVIADO;
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${data.mensaje}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        function abrirEnlaceMRW() {
            Swal.fire({
                title: 'Enlazar Guías MRW',
                html: `
                    <p class="small text-muted text-start mb-2">Pega el texto con formato: <b>ID_Master [TAB] N_Guia_MRW</b> (uno por línea).</p>
                    <textarea id="textoMRW" class="form-control" rows="8" placeholder="Ejemplo:&#10;MST-20261106202203	123456789&#10;MST-20261106202300	987654321"></textarea>
                `,
                width: '600px',
                showCancelButton: true,
                confirmButtonText: 'Enlazar Guías',
                confirmButtonColor: '#0d1b5e',
                preConfirm: () => {
                    const texto = document.getElementById('textoMRW').value;
                    if (!texto) return Swal.showValidationMessage('Por favor, pega el texto primero.');
                    return texto;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Enlazando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    postAPI({ accion: 'enlazarGuiasMRW', texto: result.value })
                    .then(resp => {
                        if (resp.exito) {
                            Swal.fire('¡Éxito!', resp.mensaje, 'success');
                            cargarMasters();
                        } else {
                            Swal.fire('Error', resp.mensaje, 'error');
                        }
                    })
                    .catch(() => Swal.fire('Error', 'No se pudo conectar.', 'error'));
                }
            });
        }

        async function abrirTimeline(idMaster) {
            document.getElementById('modalIdMaster').textContent = idMaster;
            document.getElementById('hitoIdMaster').value = idMaster;
            
            const lista = document.getElementById('listaTimeline');
            lista.innerHTML = '<li class="text-muted">Cargando historial...</li>';

            try {
                const data = await postAPI({ accion: 'obtenerTimeline', idMaster: idMaster });

                if (data.exito) {
                    lista.innerHTML = `
                        <li>
                            <strong>Master Creado</strong><br>
                            <small class="text-muted">Registrado en el sistema</small>
                        </li>
                    `;

                    if (data.historial.length === 0) {
                        lista.innerHTML += '<li class="text-muted">No hay más hitos registrados aún.</li>';
                    } else {
                        data.historial.forEach(h => {
                            let nombreHito = h.hito.replace('_', ' ');
                            lista.innerHTML += `
                                <li>
                                    <strong>${nombreHito}</strong><br>
                                    <small class="text-muted"><i class="bi bi-calendar-event"></i> ${h.fecha}</small><br>
                                    ${h.observaciones ? `<small class="text-secondary">Obs: ${h.observaciones}</small>` : ''}
                                </li>
                            `;
                        });
                    }
                }
            } catch (error) {
                lista.innerHTML = '<li class="text-danger">Error al cargar el historial.</li>';
            }

            modalTimeline.show();
        }

        // ==========================================
        // UTILIDAD ESTÁNDAR DE PETICIONES
        // ==========================================
        function postAPI(payload) {
            return fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(r => r.json());
        }
    </script>
</body>
</html>
