<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Seguimiento de Masters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
        .card-semaforo { border-left: 5px solid; cursor: pointer; transition: transform 0.2s; }
        .card-semaforo:hover { transform: scale(1.02); }
        .verde { border-left-color: #198754; }
        .amarillo { border-left-color: #ffc107; }
        .rojo { border-left-color: #dc3545; }
        .negro { border-left-color: #212529; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-box-seam me-2"></i>IPOSTEL - Seguimiento</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- Tarjetas de Resumen -->
        <div class="row mb-4" id="tarjetasResumen">
            <div class="col-md-3">
                <div class="card card-semaforo verde shadow-sm p-3">
                    <h6 class="text-muted mb-1">Masters OK</h6>
                    <h3 class="mb-0 fw-bold" id="countOK">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo amarillo shadow-sm p-3">
                    <h6 class="text-muted mb-1">En Retraso</h6>
                    <h3 class="mb-0 fw-bold" id="countRetraso">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo rojo shadow-sm p-3">
                    <h6 class="text-muted mb-1">Críticos</h6>
                    <h3 class="mb-0 fw-bold" id="countCritico">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-semaforo negro shadow-sm p-3">
                    <h6 class="text-muted mb-1">Extraviados</h6>
                    <h3 class="mb-0 fw-bold" id="countExtraviado">0</h3>
                </div>
            </div>
        </div>

        <!-- Tabla de Masters -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-ul me-2"></i>Listado de Masters</h5>
                <button class="btn btn-primary btn-sm" onclick="cargarMasters()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Master</th>
                                <th>Fecha</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Piezas</th>
                                <th>Estatus</th>
                                <th>Semáforo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMasters">
                            <tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

        async function cargarMasters() {
            const tbody = document.getElementById('tablaMasters');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ accion: 'obtenerMasters' })
                });
                const data = await response.json();

                if (data.exito) {
                    tbody.innerHTML = '';
                    let conteo = { OK: 0, RETRASO: 0, CRITICO: 0, EXTRAVIADO: 0 };

                    if (data.masters.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay Masters registrados en el sistema aún.</td></tr>';
                    }

                    data.masters.forEach(m => {
                        conteo[m.alerta]++;
                        
                        let badgeClass = m.alerta === 'OK' ? 'bg-success' : 
                                         m.alerta === 'RETRASO' ? 'bg-warning text-dark' : 
                                         m.alerta === 'CRITICO' ? 'bg-danger' : 'bg-dark';

                        let fila = `
                            <tr>
                                <td class="fw-bold">${m.id}</td>
                                <td>${m.fecha}</td>
                                <td>${m.origen}</td>
                                <td>${m.destino}</td>
                                <td>${m.piezas}</td>
                                <td><span class="badge bg-secondary">${m.estatus}</span></td>
                                <td><span class="badge ${badgeClass}">${m.alerta}</span></td>
                            </tr>
                        `;
                        tbody.innerHTML += fila;
                    });

                    document.getElementById('countOK').textContent = conteo.OK;
                    document.getElementById('countRetraso').textContent = conteo.RETRASO;
                    document.getElementById('countCritico').textContent = conteo.CRITICO;
                    document.getElementById('countExtraviado').textContent = conteo.EXTRAVIADO;

                } else {
                    Swal.fire('Error', data.mensaje, 'error');
                }
            } catch (error) {
                Swal.fire('Error de conexión', 'No se pudo conectar con el servidor.', 'error');
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', cargarMasters);
    </script>
</body>
</html>
