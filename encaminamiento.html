<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Encaminamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-box-seam me-2"></i>IPOSTEL - Encaminamiento</a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" onclick="buscarPaqueteUniversal()">
                    <i class="bi bi-search"></i> Buscar Paquete
                </button>
                <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="emitirReporte()">
                    <i class="bi bi-file-earmark-pdf"></i> Emitir Reporte PDF
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <!-- Formulario para Crear Master -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-plus-circle me-2"></i>Crear Nuevo Master</h5>
                    </div>
                    <div class="card-body">
                        <form id="formMaster">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Estado Origen</label>
                                <input type="text" class="form-control" id="origen" required placeholder="Ej: Caracas">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Estado Destino</label>
                                <select class="form-select" id="destino" required>
                                    <option value="">Seleccione...</option>
                                    <option value="Aragua">Aragua</option>
                                    <option value="Carabobo">Carabobo</option>
                                    <option value="Zulia">Zulia</option>
                                    <option value="Miranda">Miranda</option>
                                    <option value="Lara">Lara</option>
                                    <option value="Táchira">Táchira</option>
                                    <option value="Mérida">Mérida</option>
                                    <option value="Anzoátegui">Anzoátegui</option>
                                    <option value="Bolívar">Bolívar</option>
                                    <option value="Amazonas">Amazonas</option>
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Piezas</label>
                                    <input type="number" class="form-control" id="piezas" required min="1">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Peso (Kg)</label>
                                    <input type="number" step="0.1" class="form-control" id="peso" required min="0.1">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">N° Guía MRW</label>
                                <input type="text" class="form-control" id="guiaMrw" placeholder="Opcional">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Master</button>
                        </form>
                        
                        <button type="button" class="btn btn-outline-primary w-100 mt-2 fw-bold" onclick="abrirCargaMasiva()">
                            <i class="bi bi-clipboard-data"></i> Carga Masiva (Pegar Texto)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de Masters -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-list-ul me-2"></i>Masters Registrados</h5>
                        <button class="btn btn-outline-primary btn-sm" onclick="cargarMasters()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Origen</th>
                                        <th>Destino</th>
                                        <th>Piezas</th>
                                        <th>Estatus</th>
                                        <th>Foto</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaMasters">
                                    <tr><td colspan="6" class="text-center py-4">Cargando datos...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';
        const sesion = { usuario: '', rol: '' };

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Validación de sesión específica para Coordinador de Encaminamiento
            const urlParams = new URLSearchParams(window.location.search);
            sesion.usuario = urlParams.get('u') || sessionStorage.getItem('ipostel_usuario') || '';
            sesion.rol = (urlParams.get('rol') || sessionStorage.getItem('ipostel_rol') || '').toUpperCase();

            if (!sesion.usuario || sesion.rol !== 'COORD_ENCAM') {
                Swal.fire('Acceso Restringido', 'Debe iniciar sesión como Coordinador de Encaminamiento.', 'warning')
                    .then(() => window.location.href = 'index.html');
                return;
            }

            // 2. Carga inicial
            cargarMasters();

            // 3. Evento del formulario
            document.getElementById('formMaster').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerHTML = 'Guardando...';
               
// === INICIO: CÁLCULO AUTOMÁTICO DE COBRO ===
try {
    const tipoServicio = document.getElementById('tipoServicio')?.value || 'ORDINARIO NACIONAL'; // Ajusta el ID si tu select tiene otro nombre
    const pesoKg = parseFloat(document.getElementById('peso').value) || 0;
    
    const cobro = await postAPI({
        accion: 'calcularCobroEnvio',
        tipoServicio: tipoServicio,
        pesoKg: pesoKg,
        modalidad: 'NACIONAL' // Cambiar a INTERNACIONAL si aplica
    });

    if (!cobro.error) {
        // Guardamos los valores financieros en variables temporales para usarlos abajo
        window.cobroNeto = cobro.neto;
        window.cobroIva = cobro.iva;
        window.cobroTotal = cobro.total;
        window.tarifaVersionId = cobro.versionId;
    } else {
        Swal.fire('Atención', 'No se pudo calcular el cobro: ' + cobro.error, 'warning');
    }
} catch (err) {
    console.error('Error calculando cobro:', err);
}
// === FIN: CÁLCULO AUTOMÁTICO DE COBRO ===
                  const datos = {
                    accion: 'crearMaster',
                    origen: document.getElementById('origen').value,
                    destino: document.getElementById('destino').value,
                    piezas: document.getElementById('piezas').value,
                    peso: document.getElementById('peso').value,
                    guiaMrw: document.getElementById('guiaMrw').value, // <--- COMA AGREGADA
                    montoNeto: window.cobroNeto || 0,
                    iva: window.cobroIva || 0,
                    montoTotal: window.cobroTotal || 0,
                    tarifaVersionId: window.tarifaVersionId || ''
                };

                try {
                    const data = await postAPI(datos);
                    if (data.exito) {
                        Swal.fire('¡Guardado!', 'El Master ha sido creado.', 'success');
                        document.getElementById('formMaster').reset();
                        cargarMasters();
                    } else {
                        Swal.fire('Error', data.mensaje, 'error');
                    }
                } catch (error) {
                    Swal.fire('Error de conexión', 'No se pudo conectar con el servidor.', 'error');
                }

                btn.disabled = false;
                btn.innerHTML = 'Guardar Master';
            });
        });

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ==========================================
        // BUSCADOR UNIVERSAL DE PAQUETES
        // ==========================================
        function buscarPaqueteUniversal() {
            Swal.fire({
                title: '🔍 Rastreador de Paquetes',
                input: 'text',
                inputLabel: 'Ingrese el código de seguimiento o ID Master',
                inputPlaceholder: 'Ej: H51D8 o MST-XXXXX',
                showCancelButton: true,
                confirmButtonText: 'Buscar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#0d1b5e',
                inputAttributes: { autocapitalize: 'off', autocomplete: 'off' }
            }).then(r => {
                if (r.isConfirmed && r.value) {
                    Swal.fire({ title: 'Buscando en el sistema...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    postAPI({ accion: 'buscarPaquete', codigo: r.value.trim() }).then(resp => {
                        Swal.close();
                        if (resp.exito && resp.paquete) {
                            const p = resp.paquete;
                            let badgeRecepcion = 'bg-secondary';
                            if (p.estatusRecepcion === 'Pendiente_Recepcion') badgeRecepcion = 'bg-warning text-dark';
                            else if (p.estatusRecepcion === 'En_Custodia') badgeRecepcion = 'bg-primary';
                            else if (p.estatusRecepcion === 'Entregado') badgeRecepcion = 'bg-success';
                            else if (p.estatusRecepcion === 'Extraviado' || p.estatusRecepcion === 'Retrasado') badgeRecepcion = 'bg-danger';

                            Swal.fire({
                                title: '📦 Resultados: ' + p.codigo,
                                html: `
                                    <div class="text-start bg-light p-3 rounded">
                                        <div class="row g-2">
                                            <div class="col-6"><small class="text-muted">Estado General:</small><br><span class="badge bg-info text-dark">${p.estatusGeneral}</span></div>
                                            <div class="col-6"><small class="text-muted">Estado en OPT:</small><br><span class="badge ${badgeRecepcion}">${p.estatusRecepcion}</span></div>
                                            <div class="col-12"><small class="text-muted">OPT Destino:</small><br><b>${p.optDestino}</b></div>
                                            <hr class="my-2">
                                            <div class="col-6"><small class="text-muted">Origen:</small><br>${p.origen}</div>
                                            <div class="col-6"><small class="text-muted">Destino:</small><br>${p.destino}</div>
                                            <div class="col-4"><small class="text-muted">Piezas:</small><br><b>${p.piezas}</b></div>
                                            <div class="col-8"><small class="text-muted">Guía MRW:</small><br>${p.guiaMrw}</div>
                                        </div>
                                    </div>
                                `,
                                icon: 'success',
                                confirmButtonColor: '#0d1b5e',
                                width: '600px'
                            });
                        } else {
                            Swal.fire('No encontrado', resp.mensaje || 'El código no existe en el sistema.', 'warning');
                        }
                    }).catch(() => {
                        Swal.close();
                        Swal.fire('Error de conexión', 'No se pudo comunicar con el servidor.', 'error');
                    });
                }
            });
        }

        async function cargarMasters() {
            const tbody = document.getElementById('tablaMasters');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Cargando datos...</td></tr>';

            try {
                const data = await postAPI({ accion: 'obtenerMasters' });

                if (data.exito) {
                    tbody.innerHTML = '';
                    if (data.masters.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay Masters registrados.</td></tr>';
                        return;
                    }
                    data.masters.forEach(m => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${m.id || 'N/A'}</td>
                                <td>${m.origen || 'N/A'}</td>
                                <td>${m.destino || 'N/A'}</td>
                                <td>${m.piezas || 0}</td>
                                <td><span class="badge bg-secondary">${m.estatus || 'N/A'}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-info" onclick="abrirSubidaFoto('${m.id}')">
                                        <i class="bi bi-camera"></i> Subir
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${data.mensaje}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        async function emitirReporte() {
            Swal.fire({
                title: 'Generando Reporte...',
                text: 'Por favor espere, esto puede tardar unos segundos.',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const data = await postAPI({ accion: 'generarReporte' });
                if (data.exito) {
                    Swal.fire('¡Enviado!', data.mensaje, 'success');
                } else {
                    Swal.fire('Error', data.mensaje, 'error');
                }
            } catch (error) {
                Swal.fire('Error de conexión', 'No se pudo generar el reporte.', 'error');
            }
        }

        // --- CARGA MASIVA ---
        function abrirCargaMasiva() {
            Swal.fire({
                title: 'Carga Masiva de Masters',
                html: `
                    <p class="small text-muted text-start mb-2">Pega el texto copiado de Word o Excel. Formato: <b>Origen, Destino, Piezas, Peso, GuíaMRW</b> (separados por tabulación o coma).</p>
                    <textarea id="textoMasivo" class="form-control" rows="8" placeholder="Ejemplo:&#10;Caracas	Zulia	15	10.5	123456789&#10;Caracas	Táchira	20	15.2	987654321"></textarea>
                `,
                width: '600px',
                showCancelButton: true,
                confirmButtonText: 'Procesar Carga',
                confirmButtonColor: '#0d1b5e',
                preConfirm: () => {
                    const texto = document.getElementById('textoMasivo').value;
                    if (!texto) return Swal.showValidationMessage('Por favor, pega el texto primero.');
                    return texto;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    postAPI({ accion: 'cargarMasivo', texto: result.value })
                    .then(resp => {
                        if (resp.exito) {
                            Swal.fire('¡Éxito!', resp.mensaje, 'success');
                            cargarMasters();
                        } else {
                            Swal.fire('Error', resp.mensaje, 'error');
                        }
                    })
                    .catch(() => Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error'));
                }
            });
        }

        function abrirSubidaFoto(idMaster) {
            Swal.fire({
                title: 'Subir Foto de Balanza',
                html: `
                    <p class="small text-muted mb-2">Master: <b>${idMaster}</b></p>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="form-control">
                    <small class="text-muted mt-2 d-block">La imagen se comprimirá automáticamente.</small>
                `,
                showCancelButton: true,
                confirmButtonText: 'Subir Foto',
                confirmButtonColor: '#0d1b5e',
                preConfirm: () => {
                    const file = document.getElementById('fotoInput').files[0];
                    if (!file) return Swal.showValidationMessage('Selecciona una foto.');
                    
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800;
                                const scaleSize = MAX_WIDTH / img.width;
                                canvas.width = MAX_WIDTH;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                resolve({ idMaster: idMaster, imagen: dataUrl });
                            };
                        };
                        reader.onerror = (error) => reject(error);
                    });
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Subiendo...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    postAPI({ 
                        accion: 'subirFotoBalanza', 
                        idMaster: result.value.idMaster, 
                        imagen: result.value.imagen 
                    })
                    .then(resp => {
                        if (resp.exito) Swal.fire('¡Subida!', 'La foto se guardó correctamente.', 'success');
                        else Swal.fire('Error', resp.mensaje, 'error');
                    })
                    .catch(() => Swal.fire('Error', 'No se pudo conectar.', 'error'));
                }
            });
        }

        // ==========================================
        // UTILIDAD ESTÁNDAR DE PETICIONES (JSON)
        // ==========================================
        function postAPI(payload) {
            return fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(r => r.json());
        }
    </script>
</body>
</html>
