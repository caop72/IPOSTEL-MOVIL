<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Panel de Estados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
        .table-warning { background-color: #fff3cd !important; }
        .table-danger { background-color: #f8d7da !important; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-geo-alt me-2"></i>IPOSTEL - Gerencia de Estado (<span id="nombreEstado">Cargando...</span>)
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" onclick="buscarPaqueteUniversal()">
                    <i class="bi bi-search"></i> Buscar Paquete
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Selector de Estado -->
    <div class="container-fluid px-4 mb-3">
        <div class="row justify-content-end">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white fw-bold">Estado:</span>
                    <select class="form-select fw-bold" id="selectorEstado" onchange="cargarEnvios()">
                        <option value="">Seleccione su Estado...</option>
                        <option value="Amazonas">Amazonas</option>
                        <option value="Anzoátegui">Anzoátegui</option>
                        <option value="Apure">Apure</option>
                        <option value="Aragua">Aragua</option>
                        <option value="Barinas">Barinas</option>
                        <option value="Bolívar">Bolívar</option>
                        <option value="Carabobo">Carabobo</option>
                        <option value="Cojedes">Cojedes</option>
                        <option value="Delta Amacuro">Delta Amacuro</option>
                        <option value="Falcón">Falcón</option>
                        <option value="Guárico">Guárico</option>
                        <option value="La Guaira">La Guaira</option>
                        <option value="Lara">Lara</option>
                        <option value="Mérida">Mérida</option>
                        <option value="Miranda">Miranda</option>
                        <option value="Monagas">Monagas</option>
                        <option value="Nueva Esparta">Nueva Esparta</option>
                        <option value="Portuguesa">Portuguesa</option>
                        <option value="Sucre">Sucre</option>
                        <option value="Táchira">Táchira</option>
                        <option value="Trujillo">Trujillo</option>
                        <option value="Yaracuy">Yaracuy</option>
                        <option value="Zulia">Zulia</option>
                        <option value="Caracas D.C.">Caracas D.C.</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid px-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-box-seam me-2"></i>Masters en Tránsito hacia mi Estado</h5>
                <button class="btn btn-outline-primary btn-sm" onclick="cargarEnvios()">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Master</th>
                                <th>Origen</th>
                                <th>Destino</th>
                                <th>Piezas</th>
                                <th>Peso (Kg)</th>
                                <th>Estatus</th>
                                <th>Foto Balanza</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEnvios">
                            <tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec";
        const sesion = { usuario: '', rol: '', estado: '' };

        document.addEventListener('DOMContentLoaded', function () {
            // 1. Validación de sesión específica para Gerencia de Estado
            const urlParams = new URLSearchParams(window.location.search);
            sesion.usuario = urlParams.get('u') || sessionStorage.getItem('ipostel_usuario') || '';
            sesion.rol = (urlParams.get('rol') || sessionStorage.getItem('ipostel_rol') || '').toUpperCase();
            sesion.estado = urlParams.get('estado') || sessionStorage.getItem('ipostel_estado') || '';

            if (!sesion.usuario || sesion.rol !== 'GERENCIA_ESTADO') {
                Swal.fire('Acceso Restringido', 'Debe iniciar sesión como Gerente de Estado.', 'warning')
                    .then(() => window.location.href = 'index.html');
                return;
            }

            // 2. Configurar el estado en la UI y cargar automáticamente
            document.getElementById('nombreEstado').innerText = sesion.estado || 'Desconocido';
            if (sesion.estado) {
                document.getElementById('selectorEstado').value = sesion.estado;
                cargarEnvios(); // Carga automática al entrar
            }
        });

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ==========================================
        // BUSCADOR UNIVERSAL DE PAQUETES
        // ==========================================
        function buscarPaqueteUniversal() {
            Swal.fire({
                title: '🔍 Rastreador de Paquetes',
                input: 'text',
                inputLabel: 'Ingrese el código de seguimiento o ID Master',
                inputPlaceholder: 'Ej: H51D8 o MST-XXXXX',
                showCancelButton: true,
                confirmButtonText: 'Buscar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#0d1b5e',
                inputAttributes: { autocapitalize: 'off', autocomplete: 'off' }
            }).then(r => {
                if (r.isConfirmed && r.value) {
                    Swal.fire({ title: 'Buscando en el sistema...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    postAPI({ accion: 'buscarPaquete', codigo: r.value.trim() }).then(resp => {
                        Swal.close();
                        if (resp.exito && resp.paquete) {
                            const p = resp.paquete;
                            let badgeRecepcion = 'bg-secondary';
                            if (p.estatusRecepcion === 'Pendiente_Recepcion') badgeRecepcion = 'bg-warning text-dark';
                            else if (p.estatusRecepcion === 'En_Custodia') badgeRecepcion = 'bg-primary';
                            else if (p.estatusRecepcion === 'Entregado') badgeRecepcion = 'bg-success';
                            else if (p.estatusRecepcion === 'Extraviado' || p.estatusRecepcion === 'Retrasado') badgeRecepcion = 'bg-danger';

                            Swal.fire({
                                title: '📦 Resultados: ' + p.codigo,
                                html: `
                                    <div class="text-start bg-light p-3 rounded">
                                        <div class="row g-2">
                                            <div class="col-6"><small class="text-muted">Estado General:</small><br><span class="badge bg-info text-dark">${p.estatusGeneral}</span></div>
                                            <div class="col-6"><small class="text-muted">Estado en OPT:</small><br><span class="badge ${badgeRecepcion}">${p.estatusRecepcion}</span></div>
                                            <div class="col-12"><small class="text-muted">OPT Destino:</small><br><b>${p.optDestino}</b></div>
                                            <hr class="my-2">
                                            <div class="col-6"><small class="text-muted">Origen:</small><br>${p.origen}</div>
                                            <div class="col-6"><small class="text-muted">Destino:</small><br>${p.destino}</div>
                                            <div class="col-4"><small class="text-muted">Piezas:</small><br><b>${p.piezas}</b></div>
                                            <div class="col-8"><small class="text-muted">Guía MRW:</small><br>${p.guiaMrw}</div>
                                        </div>
                                    </div>
                                `,
                                icon: 'success',
                                confirmButtonColor: '#0d1b5e',
                                width: '600px'
                            });
                        } else {
                            Swal.fire('No encontrado', resp.mensaje || 'El código no existe en el sistema.', 'warning');
                        }
                    }).catch(() => {
                        Swal.close();
                        Swal.fire('Error de conexión', 'No se pudo comunicar con el servidor.', 'error');
                    });
                }
            });
        }

        async function cargarEnvios() {
            const estadoSeleccionado = document.getElementById('selectorEstado').value;
            const tbody = document.getElementById('tablaEnvios');
            
            if (!estadoSeleccionado) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Por favor, seleccione un estado arriba.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>';

            try {
                const data = await postAPI({ accion: 'obtenerEnviosPorEstado', estado: estadoSeleccionado });

                if (data.exito) {
                    tbody.innerHTML = '';
                    if (!data.envios || data.envios.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No hay Masters registrados hacia ${estadoSeleccionado}.</td></tr>`;
                        return;
                    }
                    data.envios.forEach(m => {
                        let claseFila = '';
                        let badgeEstatus = 'bg-secondary';
                        
                        const estatus = String(m.estatus || '').trim();
                        if (estatus === 'Creado' || estatus === 'En_Transito') { 
                            claseFila = 'table-warning'; 
                            badgeEstatus = 'bg-warning text-dark'; 
                        } else if (estatus === 'Retrasado' || estatus === 'Critico' || estatus === 'Crítico') { 
                            claseFila = 'table-danger'; 
                            badgeEstatus = 'bg-danger'; 
                        } else if (estatus === 'Entregado') {
                            badgeEstatus = 'bg-success';
                        }

                        tbody.innerHTML += `
                            <tr class="${claseFila}">
                                <td class="fw-bold">${m.id || 'N/A'}</td>
                                <td>${m.origen || 'N/A'}</td>
                                <td>${m.destino || 'N/A'}</td>
                                <td>${m.piezas || 0}</td>
                                <td>${m.peso || '0'}</td>
                                <td><span class="badge ${badgeEstatus}">${estatus}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-info" onclick="abrirSubidaFoto('${m.id}')">
                                        <i class="bi bi-camera"></i> Subir Foto
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${data.mensaje}</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        // --- SUBIR FOTO DESDE EL ESTADO ---
        function abrirSubidaFoto(idMaster) {
            Swal.fire({
                title: 'Subir Foto de Balanza',
                html: `
                    <p class="small text-muted mb-2">Master: <b>${idMaster}</b></p>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="form-control">
                    <small class="text-muted mt-2 d-block">La imagen se comprimirá automáticamente.</small>
                `,
                showCancelButton: true,
                confirmButtonText: 'Subir Foto',
                confirmButtonColor: '#0d1b5e',
                preConfirm: () => {
                    const file = document.getElementById('fotoInput').files[0];
                    if (!file) return Swal.showValidationMessage('Selecciona una foto.');
                    
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800; // Comprimir para ahorrar espacio
                                const scaleSize = MAX_WIDTH / img.width;
                                canvas.width = MAX_WIDTH;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                resolve({ idMaster: idMaster, imagen: dataUrl });
                            };
                        };
                        reader.onerror = (error) => reject(error);
                    });
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Subiendo...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    postAPI({ 
                        accion: 'subirFotoBalanza', 
                        idMaster: result.value.idMaster, 
                        imagen: result.value.imagen 
                    })
                    .then(resp => {
                        if (resp.exito) {
                            Swal.fire('¡Subida!', 'La foto se guardó correctamente en Drive.', 'success');
                            cargarEnvios(); // Recargar la tabla
                        } else {
                            Swal.fire('Error', resp.mensaje, 'error');
                        }
                    })
                    .catch(() => Swal.fire('Error', 'No se pudo conectar.', 'error'));
                }
            });
        }

        // ==========================================
        // UTILIDAD ESTÁNDAR DE PETICIONES (JSON)
        // ==========================================
        function postAPI(payload) {
            return fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(r => r.json());
        }
    </script>
</body>
</html>
