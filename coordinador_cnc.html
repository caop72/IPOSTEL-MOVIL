<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Coordinador CNC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-calculator me-2"></i>IPOSTEL - Coordinador CNC</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-check2-square me-2"></i>Validación y Cierre de Ruta</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Master</th>
                                <th>Origen -> Destino</th>
                                <th>Piezas</th>
                                <th>Estatus Actual</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCNC">
                            <tr><td colspan="5" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

        document.addEventListener('DOMContentLoaded', cargarMasters);

        async function cargarMasters() {
            const tbody = document.getElementById('tablaCNC');
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ accion: 'obtenerMasters' })
                });
                const data = await response.json();

                if (data.exito) {
                    tbody.innerHTML = '';
                    // Filtrar solo los que ya tienen hitos y no están cerrados
                    const pendientes = data.masters.filter(m => m.estatus !== 'Creado' && m.estatus !== 'Cerrado');

                    if (pendientes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay Masters pendientes por validar y cerrar.</td></tr>';
                    }

                    pendientes.forEach(m => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${m.id}</td>
                                <td>${m.origen} <i class="bi bi-arrow-right"></i> ${m.destino}</td>
                                <td>${m.piezas}</td>
                                <td><span class="badge bg-warning text-dark">${m.estatus}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="cerrarRuta('${m.id}')">
                                        <i class="bi bi-check-circle"></i> Validar y Cerrar
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        async function cerrarRuta(idMaster) {
            Swal.fire({
                title: '¿Cerrar ruta?',
                text: "Se validará el seguimiento y se cerrará el Master. (Los montos de cobro se agregarán aquí luego).",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#198754',
                confirmButtonText: 'Sí, cerrar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: new URLSearchParams({ accion: 'cerrarMasterCNC', idMaster: idMaster })
                        });
                        const data = await response.json();

                        if (data.exito) {
                            Swal.fire('¡Cerrado!', 'El Master ha sido cerrado exitosamente.', 'success');
                            cargarMasters();
                        } else {
                            Swal.fire('Error', data.mensaje, 'error');
                        }
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo conectar.', 'error');
                    }
                }
            });
        }
    </script>
</body>
</html>
