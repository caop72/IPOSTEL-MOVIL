<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Micro Entregas (CNC)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
        .table th { background-color: #f8f9fa; font-size: 0.85rem; text-transform: uppercase; color: #6c757d; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-box-seam me-2"></i>IPOSTEL - Micro Entregas (Auditoría CNC)</a>
            <div class="d-flex gap-2">
                <!-- BUSCADOR UNIVERSAL INTEGRADO -->
                <button class="btn btn-outline-light btn-sm" onclick="buscarPaqueteUniversal()">
                    <i class="bi bi-search"></i> Buscar Paquete
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <!-- FILTROS -->
        <div class="card mb-3 shadow-sm">
            <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold mb-1">Desde</label>
                        <input type="date" class="form-control form-control-sm" id="filtroDesde">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold mb-1">Hasta</label>
                        <input type="date" class="form-control form-control-sm" id="filtroHasta">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary btn-sm w-100" onclick="cargarMicroEntregas()">
                            <i class="bi bi-funnel"></i> Aplicar Filtros
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLERO -->
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">📦 Control de Entregas al Destinatario (OPT)</h5>
                <span class="badge bg-light text-dark" id="countMicro">0 Registros</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
                    <table class="table table-hover mb-0 align-middle text-center">
                        <thead style="position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th>Código Master</th>
                                <th>OPT Responsable</th>
                                <th>Piezas</th>
                                <th>Fecha Recepción</th>
                                <th>Tiempo en OPT</th>
                                <th>Estatus</th>
                                <th>Fecha Entrega Final</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMicro">
                            <tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec";
        const sesion = { usuario: '', rol: '' };

        document.addEventListener('DOMContentLoaded', function() {
            // 1. Validación de sesión específica para Director CNC
            const urlParams = new URLSearchParams(window.location.search);
            sesion.usuario = urlParams.get('u') || sessionStorage.getItem('ipostel_usuario') || '';
            sesion.rol = (urlParams.get('rol') || sessionStorage.getItem('ipostel_rol') || '').toUpperCase();

            if (!sesion.usuario || sesion.rol !== 'DIR_CNC') {
                Swal.fire('Acceso Restringido', 'Debe iniciar sesión como Director CNC.', 'warning')
                    .then(() => window.location.href = 'index.html');
                return;
            }

            // 2. Configuración inicial de fechas
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('filtroDesde').value = hoy;
            document.getElementById('filtroHasta').value = hoy;
            
            // 3. Carga inicial
            cargarMicroEntregas();
        });

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ==========================================
        // BUSCADOR UNIVERSAL DE PAQUETES
        // ==========================================
        function buscarPaqueteUniversal() {
            Swal.fire({
                title: '🔍 Rastreador de Paquetes',
                input: 'text',
                inputLabel: 'Ingrese el código de seguimiento o ID Master',
                inputPlaceholder: 'Ej: H51D8 o MST-XXXXX',
                showCancelButton: true,
                confirmButtonText: 'Buscar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#0d1b5e',
                inputAttributes: { autocapitalize: 'off', autocomplete: 'off' }
            }).then(r => {
                if (r.isConfirmed && r.value) {
                    Swal.fire({ title: 'Buscando en el sistema...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    postAPI({ accion: 'buscarPaquete', codigo: r.value.trim() }).then(resp => {
                        Swal.close();
                        if (resp.exito && resp.paquete) {
                            const p = resp.paquete;
                            let badgeRecepcion = 'bg-secondary';
                            if (p.estatusRecepcion === 'Pendiente_Recepcion') badgeRecepcion = 'bg-warning text-dark';
                            else if (p.estatusRecepcion === 'En_Custodia') badgeRecepcion = 'bg-primary';
                            else if (p.estatusRecepcion === 'Entregado') badgeRecepcion = 'bg-success';
                            else if (p.estatusRecepcion === 'Extraviado' || p.estatusRecepcion === 'Retrasado') badgeRecepcion = 'bg-danger';

                            Swal.fire({
                                title: '📦 Resultados: ' + p.codigo,
                                html: `
                                    <div class="text-start bg-light p-3 rounded">
                                        <div class="row g-2">
                                            <div class="col-6"><small class="text-muted">Estado General:</small><br><span class="badge bg-info text-dark">${p.estatusGeneral}</span></div>
                                            <div class="col-6"><small class="text-muted">Estado en OPT:</small><br><span class="badge ${badgeRecepcion}">${p.estatusRecepcion}</span></div>
                                            <div class="col-12"><small class="text-muted">OPT Destino:</small><br><b>${p.optDestino}</b></div>
                                            <hr class="my-2">
                                            <div class="col-6"><small class="text-muted">Origen:</small><br>${p.origen}</div>
                                            <div class="col-6"><small class="text-muted">Destino:</small><br>${p.destino}</div>
                                            <div class="col-4"><small class="text-muted">Piezas:</small><br><b>${p.piezas}</b></div>
                                            <div class="col-8"><small class="text-muted">Guía MRW:</small><br>${p.guiaMrw}</div>
                                        </div>
                                    </div>
                                `,
                                icon: 'success',
                                confirmButtonColor: '#0d1b5e',
                                width: '600px'
                            });
                        } else {
                            Swal.fire('No encontrado', resp.mensaje || 'El código no existe en el sistema.', 'warning');
                        }
                    }).catch(() => {
                        Swal.close();
                        Swal.fire('Error de conexión', 'No se pudo comunicar con el servidor.', 'error');
                    });
                }
            });
        }

        async function cargarMicroEntregas() {
            const tbody = document.getElementById('tablaMicro');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Cargando datos...</td></tr>';

            const filtros = {
                accion: 'obtenerMicroEntregas',
                fechaInicio: document.getElementById('filtroDesde').value,
                fechaFin: document.getElementById('filtroHasta').value
            };

            try {
                const data = await postAPI(filtros);

                if (data.exito) {
                    tbody.innerHTML = '';
                    // Blindaje: acepta 'micro' (como está en el stub de Code.gs) o 'datos' (por si se actualizó)
                    const registros = data.micro || data.datos || [];
                    document.getElementById('countMicro').innerText = registros.length + ' Registros';

                    if (registros.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay entregas registradas en este rango de fechas.</td></tr>';
                        return;
                    }

                    registros.forEach(m => {
                        // Lógica de colores para el estatus
                        let badgeEstatus = 'bg-secondary';
                        let textoEstatus = m.estatus || 'Desconocido';
                        let filaClase = '';

                        if (m.estatus === 'En_OPT' || m.estatus === 'En_Custodia') { 
                            badgeEstatus = 'bg-warning text-dark'; 
                            textoEstatus = 'En Custodia (Pendiente)'; 
                            const dias = m.dias || 0;
                            if (dias >= 2) filaClase = 'table-danger'; // Si tiene más de 2 días en la OPT, alerta roja
                            else if (dias >= 1) filaClase = 'table-warning';
                        } 
                        else if (m.estatus === 'Entregado_Final' || m.estatus === 'Entregado') { 
                            badgeEstatus = 'bg-success'; 
                            textoEstatus = 'Entregado al Ciudadano'; 
                        }

                        tbody.innerHTML += `
                            <tr class="${filaClase}">
                                <td class="fw-bold text-primary">${m.idMaster || m.codigo || 'N/A'}</td>
                                <td>${m.optDestino || m.opt || 'N/A'}</td>
                                <td>${m.piezas || 0}</td>
                                <td>${m.fechaRecepcion || '—'}</td>
                                <td>
                                    <span class="fw-bold">${m.dias || 0} día(s)</span>
                                </td>
                                <td><span class="badge ${badgeEstatus}">${textoEstatus}</span></td>
                                <td>${m.fechaEntrega || '—'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${data.mensaje}</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        // ==========================================
        // UTILIDAD ESTÁNDAR DE PETICIONES (JSON)
        // ==========================================
        function postAPI(payload) {
            return fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(r => r.json());
        }
    </script>
</body>
</html>
