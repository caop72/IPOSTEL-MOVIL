<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Portal OPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; }
        .navbar { background-color: #0d1b5e; }
        .navbar-brand, .nav-link { color: white !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>IPOSTEL - Portal OPT (<span id="nombreOPT">Cargando...</span>)</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-box-seam me-2"></i>Paquetes Pendientes de Entrega</h5>
                <button class="btn btn-outline-primary btn-sm" onclick="cargarPendientes()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Master</th>
                                <th>Piezas</th>
                                <th>Fecha Recepción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPendientes">
                            <tr><td colspan="4" class="text-center py-4">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec";
        
        const usuarioLogueado = (sessionStorage.getItem('usuario') || '').trim();
        const rolUsuario = (sessionStorage.getItem('rol') || '').trim();

        document.addEventListener('DOMContentLoaded', function () {
            if (!usuarioLogueado) { window.location.href = 'index.html'; return; }
            
            // Mostrar el nombre de la OPT en la barra
            document.getElementById('nombreOPT').innerText = usuarioLogueado;
            cargarPendientes();
        });

        async function cargarPendientes() {
            const tbody = document.getElementById('tablaPendientes');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">Cargando datos...</td></tr>';

            try {
                const response = await fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: new URLSearchParams({ accion: 'obtenerPendientesOPT', opt: usuarioLogueado })
                });
                const data = await response.json();

                if (data.exito) {
                    tbody.innerHTML = '';
                    if (data.pendientes.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No hay paquetes pendientes para esta OPT.</td></tr>';
                        return;
                    }
                    data.pendientes.forEach(p => {
                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${p.idMaster}</td>
                                <td>${p.piezas}</td>
                                <td>${p.fechaRecepcion}</td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="confirmarEntrega('${p.idMaster}', '${p.opt}')">
                                        <i class="bi bi-check-circle"></i> Confirmar Entrega
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Error al cargar datos.</td></tr>';
            }
        }

        async function confirmarEntrega(idMaster, optDestino) {
            const confirm = await Swal.fire({
                title: '¿Confirmar Entrega?',
                text: "Estás confirmando que el paquete fue entregado al destinatario final.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#198754',
                confirmButtonText: 'Sí, entregar'
            });

            if (confirm.isConfirmed) {
                Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                fetch(URL_APPS_SCRIPT, {
                    method: 'POST',
                    body: new URLSearchParams({ accion: 'entregarOPT', idMaster: idMaster, optDestino: optDestino })
                })
                .then(res => res.json())
                .then(resp => {
                    if (resp.exito) {
                        Swal.fire('¡Entregado!', 'El paquete ha sido registrado como entregado.', 'success');
                        cargarPendientes(); // Recargar la tabla
                    } else {
                        Swal.fire('Error', resp.mensaje, 'error');
                    }
                })
                .catch(() => Swal.fire('Error', 'No se pudo conectar.', 'error'));
            }
        }
    </script>
</body>
</html>
