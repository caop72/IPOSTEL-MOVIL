<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPOSTEL - Informe de Movilidad</title>
  
  <!-- ETIQUETAS OPEN GRAPH -->
  <meta property="og:title" content="IPOSTEL - Informe de Movilidad">
  <meta property="og:description" content="Sistema de Control y Tracking de Despachos Masters - Ingresa para gestionar la movilidad.">
  <meta property="og:image" content="https://caop72.github.io/IPOSTEL-MOVIL/portada_previa.jpg">
  <meta property="og:url" content="https://caop72.github.io/IPOSTEL-MOVIL/">
  <meta property="og:type" content="website">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    /* ========================================================
       ESTILOS DE LA PORTADA ANIMADA
       ======================================================== */
    #pantalla-portada {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(13, 27, 94, 0.9), rgba(5, 15, 40, 1));
      background-color: #0d1b5e; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .titulo-portada {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #00d2ff; 
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: -5px;
      z-index: 10;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .subtitulo-portada {
      font-family: 'Arial Black', Impact, sans-serif;
      color: #ffffff;
      font-size: 3.5rem;
      font-weight: 900;
      margin-bottom: 20px;
      z-index: 10;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffffff 20%, #e0e0e0 50%, #ffffff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 3s linear infinite;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    @keyframes shine { to { background-position: 200% center; } }

    .card-container {
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.3));
      margin-bottom: 20px;
    }

    svg { width: 100%; height: 100%; overflow: visible; }

    .sphere-light-band { animation: continuousBandSweep 4.5s ease-in-out infinite; }
    @keyframes continuousBandSweep {
        0% { transform: translateX(-60px) translateY(30px) rotate(-15deg); opacity: 0; }
        20% { opacity: 0.55; }
        50% { transform: translateX(10px) translateY(-5px) rotate(-15deg); opacity: 0.6; }
        70% { transform: translateX(45px) translateY(-25px) rotate(-15deg); opacity: 0; }
        100% { transform: translateX(-60px) translateY(30px) rotate(-15deg); opacity: 0; }
    }
    .yellow-halo { animation: pulseHalo 2.5s ease-in-out infinite alternate; transform-origin: 194px 145px; }
    @keyframes pulseHalo {
        0% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(255, 214, 0, 0.4)); }
        100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 214, 0, 0.8)); }
    }
    .orbit-shine-inner { animation: orbitLightSweep 2.8s linear infinite; }
    .delay-1 { animation-delay: 0s; } .delay-2 { animation-delay: 0.4s; } .delay-3 { animation-delay: 0.8s; }
    @keyframes orbitLightSweep {
        0% { transform: translateX(-140px) rotate(-13deg); opacity: 0; }
        20% { opacity: 1; } 80% { opacity: 1; }
        100% { transform: translateX(140px) rotate(-13deg); opacity: 0; }
    }
    .star-twinkle { animation: starFlash 2s ease-in-out infinite alternate; }
    .st-1 { animation-delay: 0.0s; } .st-2 { animation-delay: 0.3s; } .st-3 { animation-delay: 0.6s; } .st-4 { animation-delay: 0.9s; }
    .st-5 { animation-delay: 0.2s; } .st-6 { animation-delay: 0.5s; } .st-7 { animation-delay: 0.8s; } .st-8 { animation-delay: 1.1s; }
    @keyframes starFlash {
        0% { opacity: 0.4; r: 0.8; }
        100% { opacity: 1; r: 1.4; filter: drop-shadow(0 0 3px #ffffff); }
    }
    .text-sheen { animation: sheenMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes sheenMove {
        0% { transform: translateX(-220px); }
        35% { transform: translateX(220px); }
        100% { transform: translateX(220px); }
    }

    .btn-ingresar-portada {
      background: transparent;
      border: 2px solid #00d2ff;
      border-radius: 50px;
      padding: 12px 45px;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.3s ease;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
      cursor: pointer;
      z-index: 10;
      letter-spacing: 2px;
    }
    .btn-ingresar-portada:hover {
      background: #00d2ff;
      color: #0d1b5e;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
      transform: scale(1.05);
    }

    /* ========================================================
       ESTILOS DEL LOGIN
       ======================================================== */
    body { 
      background: linear-gradient(135deg, #0d1b5e 0%, #1e3a8a 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card { 
        width: 100%; max-width: 420px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        background-color: #fff; overflow: hidden; position: relative;
    }
    .flag-bar { height: 5px; background: linear-gradient(to right, #FFCC00 33%, #0033A0 33%, #0033A0 66%, #EF3340 66%); }
    
    /* Ajustes para que el form se vea bonito */
    .form-control { border-radius: 10px; padding: 12px 15px; border: 1px solid #ced4da; background: #f8f9fa; }
    .form-control:focus { box-shadow: 0 0 0 0.25rem rgba(13, 27, 94, 0.25); border-color: #0d1b5e; }
    .btn-primary { background-color: #0d1b5e; border: none; border-radius: 10px; padding: 12px; font-weight: bold; letter-spacing: 1px; transition: all 0.3s ease; }
    .btn-primary:hover { background-color: #1e3a8a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(13, 27, 94, 0.4); }
  </style>
</head>
<body>

  <!-- CAPA 1: LA PORTADA ANIMADA -->
  <div id="pantalla-portada">
    <div class="titulo-portada">Observatorio Estadístico</div>
    <div class="subtitulo-portada">Movilidad</div>
    <div class="card-container">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <mask id="crescentMask"><circle cx="194" cy="145" r="74" fill="#ffffff" /><circle cx="203" cy="145" r="74" fill="#000000" /></mask>
                <mask id="orbitMask1"><ellipse cx="200" cy="142" rx="90" ry="24" fill="#ffffff" transform="rotate(-13 200 142)" /><ellipse cx="200" cy="138" rx="90" ry="24" fill="#000000" transform="rotate(-13 200 138)" /></mask>
                <mask id="orbitMask2"><ellipse cx="200" cy="157" rx="90" ry="24" fill="#ffffff" transform="rotate(-13 200 157)" /><ellipse cx="200" cy="153" rx="90" ry="24" fill="#000000" transform="rotate(-13 200 153)" /></mask>
                <mask id="orbitMask3"><ellipse cx="200" cy="172" rx="90" ry="24" fill="#ffffff" transform="rotate(-13 200 172)" /><ellipse cx="200" cy="168" rx="90" ry="24" fill="#000000" transform="rotate(-13 200 168)" /></mask>
                <clipPath id="sphereClip"><circle cx="200" cy="145" r="65" /></clipPath>
                <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ff4b72" /><stop offset="40%" stop-color="#ab1c3e" /><stop offset="85%" stop-color="#58081c" /><stop offset="100%" stop-color="#30000c" /></radialGradient>
                <linearGradient id="softBandGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0" /><stop offset="30%" stop-color="#ffffff" stop-opacity="0.4" /><stop offset="50%" stop-color="#ffffff" stop-opacity="0.75" /><stop offset="70%" stop-color="#ffffff" stop-opacity="0.4" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></linearGradient>
                <linearGradient id="orbitLightGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0" /><stop offset="30%" stop-color="#ffffff" stop-opacity="0.8" /><stop offset="50%" stop-color="#ffffff" stop-opacity="1" /><stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></linearGradient>
                <linearGradient id="tricolorGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffd600" /><stop offset="28%" stop-color="#ffd600" /><stop offset="35%" stop-color="#001871" /><stop offset="65%" stop-color="#001871" /><stop offset="72%" stop-color="#e30613" /><stop offset="100%" stop-color="#e30613" /></linearGradient>
                <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0" /><stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></linearGradient>
                <mask id="textAndBarMask">
                    <rect x="85" y="308" width="242" height="12" rx="2" fill="#ffffff" />
                    <polygon points="108,292 124,292 116,320 100,320" fill="#ffffff" />
                    <text x="200" y="295" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', 'Impact', sans-serif" font-size="68" font-weight="900" font-style="italic" letter-spacing="-2">Ipostel</text>
                </mask>
            </defs>
            <g>
                <circle class="yellow-halo" cx="194" cy="145" r="74" fill="#ffd600" mask="url(#crescentMask)" />
                <g clip-path="url(#sphereClip)">
                    <circle cx="200" cy="145" r="65" fill="url(#sphereGrad)" />
                    <rect class="sphere-light-band" x="130" y="130" width="140" height="32" rx="16" fill="url(#softBandGrad)" filter="blur(10px)" />
                </g>
                <g mask="url(#orbitMask1)"><rect x="90" y="90" width="220" height="120" fill="#c2c9d1" /><rect class="orbit-shine-inner delay-1" x="130" y="80" width="70" height="140" fill="url(#orbitLightGrad)" filter="drop-shadow(0 0 5px #ffffff)" /></g>
                <g mask="url(#orbitMask2)"><rect x="90" y="105" width="220" height="120" fill="#c2c9d1" /><rect class="orbit-shine-inner delay-2" x="130" y="95" width="70" height="140" fill="url(#orbitLightGrad)" filter="drop-shadow(0 0 5px #ffffff)" /></g>
                <g mask="url(#orbitMask3)"><rect x="90" y="120" width="220" height="120" fill="#c2c9d1" /><rect class="orbit-shine-inner delay-3" x="130" y="110" width="70" height="140" fill="url(#orbitLightGrad)" filter="drop-shadow(0 0 5px #ffffff)" /></g>
            </g>
            <g>
                <rect x="85" y="308" width="242" height="12" rx="2" fill="url(#tricolorGradient)" />
                <polygon points="112,292 128,292 124,320 108,320" fill="#006865" />
                <polygon points="116,292 124,292 120,320 112,320" fill="#ffffff" />
                <g fill="#ffffff" transform="translate(206, 314)">
                    <circle class="star-twinkle st-1" cx="-32" cy="1.2" r="1.0" /><circle class="star-twinkle st-2" cx="-23" cy="-0.8" r="1.0" /><circle class="star-twinkle st-3" cx="-14" cy="-2.2" r="1.0" /><circle class="star-twinkle st-4" cx="-5" cy="-3.0" r="1.0" />
                    <circle class="star-twinkle st-5" cx="4" cy="-3.0" r="1.0" /><circle class="star-twinkle st-6" cx="13" cy="-2.2" r="1.0" /><circle class="star-twinkle st-7" cx="22" cy="-0.8" r="1.0" /><circle class="star-twinkle st-8" cx="31" cy="1.2" r="1.0" />
                </g>
                <text x="200" y="295" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', 'Impact', sans-serif" font-size="68" font-weight="900" font-style="italic" letter-spacing="-2">Ipostel</text>
                <g mask="url(#textAndBarMask)"><rect class="text-sheen" x="80" y="220" width="50" height="130" fill="url(#sheenGrad)" transform="skewX(-20)" /></g>
                <text x="85" y="338" fill="#ffffff" font-family="'Arial Black', sans-serif" font-size="14.5" font-weight="900" textLength="242" lengthAdjust="spacingAndGlyphs">Revolucionando el correo</text>
            </g>
        </svg>
    </div>

    <button class="btn-ingresar-portada" onclick="document.getElementById('pantalla-portada').style.opacity = '0'; setTimeout(() => document.getElementById('pantalla-portada').style.display = 'none', 600);">
       INGRESAR AL SISTEMA
    </button>
  </div>

  <!-- CAPA 2: EL LOGIN (ADAPTADO A TU SISTEMA) -->
  <div class="card login-card">
    <div class="flag-bar"></div>
    <div class="card-body p-4">
      <h4 class="mb-3 text-center">🇻🇪 IPOSTEL - Movilidad</h4>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" required autocomplete="username" placeholder="Ingrese su usuario">
        </div>

        <div class="mb-3">
          <label class="form-label">Clave</label>
          <input type="password" class="form-control" id="clave" required autocomplete="current-password" placeholder="Ingrese su clave">
        </div>

        <button type="submit" class="btn btn-primary w-100" id="btnLogin">Ingresar al Sistema</button>
      </form>

      <div class="text-center mt-3">
          <small class="text-muted">&copy; 2024 IPOSTEL - Todos los derechos reservados.</small>
      </div>
    </div>
  </div>

<script>
// URL DE TU GOOGLE APPS SCRIPT (IPOSTEL)
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec";

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';

    const usuario = document.getElementById('usuario').value;
    const clave = document.getElementById('clave').value;

    try {
        // Usamos URLSearchParams tal como exige tu backend
        const response = await fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            body: new URLSearchParams({ accion: 'login', usuario: usuario, clave: clave })
        });
        const data = await response.json();

        if (data.exito) {
            Swal.fire({
                icon: 'success',
                title: 'Bienvenido',
                text: `Ingresando como: ${data.rol}`,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                const rol = data.rol;
                // Redirección adaptada a tus archivos
                if (rol.includes('Encaminamiento')) window.location.href = 'encaminamiento.html';
                else if (rol.includes('Seguimiento')) window.location.href = 'seguimiento.html';
                else if (rol.includes('CNC')) window.location.href = 'coordinador_cnc.html';
                else if (rol.includes('Estado')) window.location.href = 'estados.html';
                else if (rol.includes('Observatorio') || rol.includes('Presidencia') || rol.includes('Despacho') || rol.includes('Operaciones')) window.location.href = 'observatorio.html';
                else window.location.href = 'observatorio.html'; 
            });
        } else {
            Swal.fire('Acceso Denegado', data.mensaje, 'error');
            btn.disabled = false;
            btn.innerHTML = 'Ingresar al Sistema';
        }
    } catch (error) {
        Swal.fire('Error de conexión', 'Verifica tu conexión a internet o el Apps Script.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Ingresar al Sistema';
    }
});
</script>
</body>
