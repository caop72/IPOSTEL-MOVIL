<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOSTEL - Informe de Movilidad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        .btn-primary { background-color: #0d1b5e; border-color: #0d1b5e; font-weight: bold; }
        .btn-primary:hover { background-color: #0a1445; border-color: #0a1445; }
        .logo-text { color: #0d1b5e; font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="logo-text">IPOSTEL</h2>
            <p class="text-muted">Informe de Movilidad</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label">Clave</label>
                <input type="password" class="form-control" id="clave" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnLogin">Ingresar</button>
        </form>
    </div>

    <script>
        // URL DE TU GOOGLE APPS SCRIPT YA INSERTADA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = 'Validando...';

            const usuario = document.getElementById('usuario').value;
            const clave = document.getElementById('clave').value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        accion: 'login',
                        usuario: usuario,
                        clave: clave
                    })
                });

                const data = await response.json();

                if (data.exito) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Bienvenido',
                        text: `Ingresando como: ${data.rol}`,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        const rol = data.rol;
                        if (rol.includes('Encaminamiento')) window.location.href = 'encaminamiento.html';
                        else if (rol.includes('Seguimiento')) window.location.href = 'seguimiento.html';
                        else if (rol.includes('CNC')) window.location.href = 'coordinador_cnc.html';
                        else if (rol.includes('Estado')) window.location.href = 'estados.html';
                        else window.location.href = 'observatorio.html';
                    });
                } else {
                    Swal.fire('Acceso Denegado', data.mensaje, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Ingresar';
                }
            } catch (error) {
                Swal.fire('Error de conexión', 'Verifica tu conexión a internet o los permisos de Google Apps Script.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Ingresar';
            }
        });
    </script>
</body>
</html>
