<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPOSTEL Móvil — Bienvenido</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root { 
    --azul-oscuro: #0b1a4a; 
    --azul-claro: #1a3b8c;
    --plateado: #d1d5db;
    --cyan: #00d2ff; 
  }
  
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    margin: 0; 
    padding: 0; 
    min-height: 100vh;
    background-color: #f4f6f9;
  }

  #pantallaBienvenida {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-claro) 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; color: white; transition: opacity 0.6s ease;
  }

  .logo-bienvenida { font-size: 4rem; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }

  #pantallaBienvenida h1 {
    font-size: 2.8rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px;
    color: var(--plateado); text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  }

  #pantallaBienvenida p { font-size: 1.1rem; color: #a0aec0; margin-bottom: 40px; letter-spacing: 2px; }

  .btn-bienvenida { 
    background: transparent; border: 2px solid var(--plateado); color: var(--plateado); 
    padding: 12px 50px; border-radius: 30px; font-weight: 600; font-size: 1.1rem;
    transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
  }

  .btn-bienvenida:hover { background: var(--plateado); color: var(--azul-oscuro); box-shadow: 0 0 15px rgba(209, 213, 219, 0.5); }

  #pantallaLogin { display: none; min-height: 100vh; padding: 40px 20px; background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-claro) 100%); }

  .card-ipostel { background: #fff; color: #222; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 500px; margin: auto; padding: 30px; }
  
  .titulo { color: var(--azul-oscuro); font-weight: 700; margin-bottom: 0; }
  .subtitulo { color: #6c757d; font-size: 0.9rem; }
  .btn-ipostel { background: var(--azul-oscuro); color: #fff; font-weight: 600; border: none; padding: 12px; border-radius: 8px; transition: 0.3s; }
  .btn-ipostel:hover { background: #061133; color: var(--cyan); }
  .form-label { font-weight: 600; color: #444; font-size: 0.85rem; margin-bottom: 4px; }
  .form-control, .form-select { border-radius: 8px; border: 1px solid #ced4da; font-size: 0.95rem; }
  .form-control:focus, .form-select:focus { border-color: var(--cyan); box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25); }
  .oculto { display: none !important; }
  .box-clave { background: #f8f9fa; border-radius: 8px; padding: 15px; border: 1px solid #e9ecef; }
</style>
</head>
<body>

<div id="pantallaBienvenida">
  <div class="logo-bienvenida">📮</div> 
  <h1>IPOSTEL Móvil</h1>
  <p>Control y tracking vectorial de despachos</p>
  <button class="btn btn-bienvenida" onclick="entrarAlSistema()">Ingresar</button>
</div>

<div id="pantallaLogin">
  <div class="card card-ipostel">
    <div class="text-center mb-4">
      <h2 class="titulo">Acceso al Sistema</h2>
      <span class="subtitulo">Seleccione su rol para continuar</span>
    </div>

    <div id="pasoRol" class="mb-3">
      <label class="form-label text-primary">Seleccione su Rol</label>
      <select id="selRol" class="form-select fw-bold" onchange="cambiarRol()">
        <option value="">-- Seleccione su rol --</option>
        <option value="PRESIDENCIA">Presidencia</option>
        <option value="DESPACHO">Despacho</option>
        <option value="OBSERVATORIO">Observatorio</option>
        <option value="DIRECCION">Dirección</option>
        <option value="GERENCIA_ESTADO">Gerencia de Estado</option>
        <option value="COORDINADOR">Coordinador</option>
        <option value="JEFE_OPT">Jefe de OPT</option>
        <option value="ANALISTA_OPT">Analista de OPT</option>
      </select>
    </div>

    <div id="pasoSubRol" class="mb-3 oculto">
      <label class="form-label">Seleccione opción</label>
      <select id="selSubRol" class="form-select" onchange="verificarUsuario()">
        <option value="">-- Seleccione --</option>
      </select>
    </div>

    <div id="pasoEstado" class="mb-3 oculto">
      <label class="form-label">Estado</label>
      <select id="selEstado" class="form-select" onchange="cambiarEstado()">
        <option value="">-- Seleccione Estado --</option>
      </select>
    </div>

    <div id="pasoOPT" class="mb-3 oculto">
      <label class="form-label">OPT</label>
      <select id="selOPT" class="form-select" onchange="verificarUsuario()">
        <option value="">-- Seleccione OPT --</option>
      </select>
    </div>

    <div id="pasoCredenciales" class="oculto">
      <div id="boxLoginExistente" class="mb-3 box-clave oculto">
        <label class="form-label">Clave de Acceso</label>
        <input id="inpClave" type="password" class="form-control" placeholder="••••">
      </div>

      <div id="boxRegistroNuevo" class="mb-3 p-3 bg-light rounded border oculto">
        <h6 class="text-primary mb-3 fw-bold">Datos de Registro</h6>
        <div class="mb-2">
          <label class="form-label small mb-1">Correo Electrónico</label>
          <input id="inpCorreo" type="email" class="form-control form-control-sm" placeholder="correo@ipostel.gob.ve">
        </div>
        <div class="mb-2">
          <label class="form-label small mb-1">Nombres y Apellidos</label>
          <input id="inpNombre" type="text" class="form-control form-control-sm" placeholder="Ej: Juan Pérez">
        </div>
        <div class="mb-2">
          <label class="form-label small mb-1">Cédula de Identidad</label>
          <input id="inpCedula" type="text" class="form-control form-control-sm" placeholder="Ej: V-12345678">
        </div>
        <div class="mb-0">
          <label class="form-label small mb-1">Clave de 4 dígitos</label>
          <input id="inpClaveNueva" type="password" maxlength="4" inputmode="numeric" class="form-control form-control-sm" placeholder="••••">
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button id="btnRegistrar" class="btn btn-success w-100 mb-2 oculto" onclick="registrarUsuario()">
        📝 Registrarse
      </button>
      <button id="btnIngresar" class="btn btn-ipostel w-100 mb-2 oculto" onclick="enviarAlBackend()">
        🔑 Ingresar al Sistema
      </button>
      <button id="btnVolver" class="btn btn-outline-secondary w-100 oculto" onclick="volverAtras()">
        ⬅ Volver / Cancelar
      </button>
    </div>

    <div class="text-center mt-3">
      <a href="#" onclick="recuperar()" class="small text-decoration-none text-muted">¿Olvidó su clave?</a>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

const estadoApp = {
  rol: null,
  requiereEstado: false,
  requiereOPT: false,
  usuarioExiste: null,
  estadoSel: null,
  optSel: null,
  subRolSel: null
};

const ROLES_CON_ESTADO = ['GERENCIA_ESTADO', 'JEFE_OPT', 'ANALISTA_OPT'];
const ROLES_CON_OPT = ['JEFE_OPT', 'ANALISTA_OPT'];

function ocultar(id) {
  document.getElementById(id).classList.add('oculto');
}

function ocultarTodo() {
  ['pasoSubRol', 'pasoEstado', 'pasoOPT', 'pasoCredenciales', 'boxLoginExistente', 'boxRegistroNuevo', 'btnIngresar', 'btnRegistrar', 'btnVolver']
    .forEach(id => ocultar(id));
}

function mostrar(id) {
  document.getElementById(id).classList.remove('oculto');
}

function entrarAlSistema() {
  document.getElementById('pantallaBienvenida').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('pantallaBienvenida').style.display = 'none';
    document.getElementById('pantallaLogin').style.display = 'block';
  }, 600);
}

function cambiarRol() {
  const rol = document.getElementById('selRol').value;
  ocultarTodo();
  
  estadoApp.rol = rol;
  estadoApp.usuarioExiste = null;
  estadoApp.estadoSel = null;
  estadoApp.optSel = null;
  estadoApp.subRolSel = null;

  if (!rol) return;

  estadoApp.requiereEstado = ROLES_CON_ESTADO.includes(rol);
  estadoApp.requiereOPT = ROLES_CON_OPT.includes(rol);

  if (rol === 'DIRECCION') {
    mostrar('pasoSubRol');
    mostrar('btnVolver');
    const sel = document.getElementById('selSubRol');
    sel.innerHTML = `<option value="">-- Seleccione --</option>
      <option value="CNC">Dirección CNC</option>
      <option value="OPERACIONES">Dirección de Operaciones</option>`;
  } 
  else if (rol === 'COORDINADOR') {
    mostrar('pasoSubRol');
    mostrar('btnVolver');
    const sel = document.getElementById('selSubRol');
    sel.innerHTML = `<option value="">-- Seleccione --</option>
      <option value="ENCAMINAMIENTO">Encaminamiento (Mariana)</option>
      <option value="ALIANZA">Control del Aliado (Alfredo)</option>
      <option value="CNC_MICRO">CNC-Micro Entrega (José)</option>`;
  }
  else if (estadoApp.requiereEstado) {
    mostrar('pasoEstado');
    mostrar('btnVolver');
    cargarEstados();
  } 
  else {
    mostrar('pasoCredenciales');
    mostrar('boxLoginExistente');
    mostrar('btnIngresar');
    document.getElementById('btnIngresar').textContent = '🔑 Ingresar al Sistema';
  }
}

function cambiarEstado() {
  estadoApp.estadoSel = document.getElementById('selEstado').value;
  ocultarTodo();

  if (!estadoApp.estadoSel) {
    mostrar('pasoEstado');
    mostrar('btnVolver');
    return;
  }

  if (estadoApp.requiereOPT) {
    mostrar('pasoEstado');
    mostrar('pasoOPT');
    mostrar('btnVolver');
    cargarOPTs(estadoApp.estadoSel);
  } else {
    mostrar('pasoEstado');
    mostrar('btnVolver');
    verificarUsuario(); 
  }
}

async function verificarUsuario() {
  if (estadoApp.rol === 'DIRECCION' || estadoApp.rol === 'COORDINADOR') {
    estadoApp.subRolSel = document.getElementById('selSubRol').value;
    if (!estadoApp.subRolSel) return;
  }

  if (estadoApp.requiereOPT) {
    estadoApp.optSel = document.getElementById('selOPT').value;
    if (!estadoApp.optSel) {
      mostrar('pasoEstado');
      mostrar('pasoOPT');
      mostrar('btnVolver');
      return;
    }
  }

  mostrar('pasoCredenciales');
  mostrar('btnVolver');
  
  const payload = {
    accion: 'verificarExistencia',
    rol: estadoApp.rol,
    estado: estadoApp.estadoSel,
    opt: estadoApp.optSel,
    subRol: estadoApp.subRolSel
  };

  try {
    const resp = await postAPI(payload);
    if (resp.exito) {
      estadoApp.usuarioExiste = resp.existe;
      
      if (resp.existe) {
        ocultar('boxRegistroNuevo');
        mostrar('boxLoginExistente');
        ocultar('btnRegistrar');
        mostrar('btnIngresar');
        document.getElementById('btnIngresar').textContent = '🔑 Ingresar al Sistema';
      } else {
        ocultar('boxLoginExistente');
        mostrar('boxRegistroNuevo');
        mostrar('btnRegistrar');
        ocultar('btnIngresar');
        document.getElementById('btnRegistrar').textContent = '📝 Registrarse';
      }
    } else {
      Swal.fire('Error', resp.mensaje, 'error');
    }
  } catch (e) {
    Swal.fire('Error de red', 'No se pudo verificar el usuario.', 'error');
  }
}

async function registrarUsuario() {
  const rol = estadoApp.rol;
  const correo = document.getElementById('inpCorreo').value.trim();
  const nombre = document.getElementById('inpNombre').value.trim();
  const cedula = document.getElementById('inpCedula').value.trim();
  const clave = document.getElementById('inpClaveNueva').value.trim();

  if (!correo || !nombre || !cedula || !clave) {
    Swal.fire('Atención', 'Complete todos los datos de registro.', 'warning');
    return;
  }
  if (!/^\d{4}$/.test(clave)) {
    Swal.fire('Atención', 'La clave debe tener exactamente 4 dígitos.', 'warning');
    return;
  }

  let payload = { accion: 'loginArbol', rol: rol, correo, nombre, cedula, clave };

  if (rol === 'DIRECCION' || rol === 'COORDINADOR') {
    payload.subRol = estadoApp.subRolSel;
    if (rol === 'DIRECCION') payload.usuario = (estadoApp.subRolSel === 'CNC') ? 'Director_CNC' : 'Director_Operaciones';
  } else if (estadoApp.requiereEstado) {
    payload.estado = estadoApp.estadoSel;
  }
  if (estadoApp.requiereOPT) {
    payload.codigoOPT = estadoApp.optSel;
  }

  const btn = document.getElementById('btnRegistrar');
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  try {
    const resp = await postAPI(payload);
    if (!resp.exito) {
      Swal.fire('Error', resp.mensaje, 'error');
    } else {
      Swal.fire('✅ Registrado', 'Usuario creado exitosamente. Ahora puede ingresar.', 'success');
      verificarUsuario(); 
    }
  } catch (err) {
    Swal.fire('Error de conexión', err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📝 Registrarse';
  }
}

async function enviarAlBackend() {
  const rol = estadoApp.rol;
  let payload = { accion: 'loginArbol', rol: rol };
  payload.clave = document.getElementById('inpClave').value.trim();

  if (['PRESIDENCIA', 'DESPACHO', 'OBSERVATORIO'].includes(rol)) {
    if (rol === 'PRESIDENCIA') payload.usuario = 'Presidencia';
    if (rol === 'DESPACHO') payload.usuario = 'Despacho';
    if (rol === 'OBSERVATORIO') payload.usuario = 'Observatorio';
  }
  else if (rol === 'DIRECCION' || rol === 'COORDINADOR') {
    payload.subRol = estadoApp.subRolSel;
    if (rol === 'DIRECCION') payload.usuario = (estadoApp.subRolSel === 'CNC') ? 'Director_CNC' : 'Director_Operaciones';
  }
  else if (estadoApp.requiereEstado) {
    payload.estado = estadoApp.estadoSel;
  }

  if (estadoApp.requiereOPT) {
    payload.codigoOPT = estadoApp.optSel;
  }

  const btn = document.getElementById('btnIngresar');
  btn.disabled = true;
  btn.textContent = 'Validando...';

  try {
    const resp = await postAPI(payload);
    if (!resp.exito) {
      Swal.fire('Acceso denegado', resp.mensaje || 'No autorizado', 'error');
      btn.disabled = false;
      btn.textContent = '🔑 Ingresar al Sistema';
      return;
    }
    redirigir(resp);
  } catch (err) {
    Swal.fire('Error de conexión', err.message, 'error');
    btn.disabled = false;
    btn.textContent = '🔑 Ingresar al Sistema';
  }
}

function redirigir(r) {
  const rol = r.rol || estadoApp.rol;
  const usuario = r.usuario || '';
  
  sessionStorage.setItem('ipostel_rol', rol);
  sessionStorage.setItem('ipostel_usuario', usuario);
  if (estadoApp.estadoSel) sessionStorage.setItem('ipostel_estado', estadoApp.estadoSel);
  if (estadoApp.optSel) sessionStorage.setItem('ipostel_opt', estadoApp.optSel);

  const rutas = {
    PRESIDENCIA: 'observatorio.html', DESPACHO: 'observatorio.html', OBSERVATORIO: 'observatorio.html',
    DIR_CNC: 'microentregas.html', DIR_OPER: 'observatorio.html',
    GERENTE_ESTADO: 'estados.html', COORD_ENCAM: 'encaminamiento.html', COORD_ALIANZA: 'seguimiento.html',
    COORD_CNC: 'coordinador_cnc.html', JEFE_OPT: 'portal_opt.html', ANALISTA_OPT: 'portal_opt.html'
  };
  
  let pantalla = r.pantalla || rutas[rol] || 'observatorio.html';
  
  // Construir parámetros de URL dinámicamente
  const params = new URLSearchParams();
  params.append('u', usuario);
  params.append('rol', rol);
  if (estadoApp.estadoSel) params.append('estado', estadoApp.estadoSel);
  if (estadoApp.optSel) params.append('opt', estadoApp.optSel);

  const urlFinal = pantalla + '?' + params.toString();
  window.location.replace(urlFinal);
}

function volverAtras() {
  if (!document.getElementById('pasoCredenciales').classList.contains('oculto')) {
    document.getElementById('pasoCredenciales').classList.add('oculto');
    if (estadoApp.requiereOPT) {
      mostrar('pasoEstado');
      mostrar('pasoOPT');
    } else if (estadoApp.requiereEstado) {
      mostrar('pasoEstado');
    } else {
      document.getElementById('selRol').value = '';
      cambiarRol();
    }
    return;
  }
  if (!document.getElementById('pasoOPT').classList.contains('oculto')) {
    document.getElementById('pasoOPT').classList.add('oculto');
    mostrar('pasoEstado');
    return;
  }
  if (!document.getElementById('pasoEstado').classList.contains('oculto')) {
    document.getElementById('pasoEstado').classList.add('oculto');
    document.getElementById('selRol').value = '';
    cambiarRol();
    return;
  }
  document.getElementById('selRol').value = '';
  cambiarRol();
}

function cargarEstados() {
  postAPI({accion: 'obtenerEstados'}).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selEstado');
      sel.innerHTML = '<option value="">-- Seleccione Estado --</option>';
      r.estados.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
    }
  });
}

function cargarOPTs(estado) {
  postAPI({accion: 'obtenerOPTsPorEstado', estado: estado}).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selOPT');
      sel.innerHTML = '<option value="">-- Seleccione OPT --</option>';
      r.opts.forEach(o => sel.innerHTML += `<option value="${o.codigo}">${o.nombre}</option>`);
      mostrar('pasoOPT');
    }
  });
}

function recuperar() {
  Swal.fire({
    title: 'Recuperar clave', input: 'email', inputLabel: 'Escriba su correo registrado',
    inputPlaceholder: 'correo@ipostel.gob.ve', showCancelButton: true, confirmButtonColor: '#0d1b5e'
  }).then(res => {
    if (res.isConfirmed && res.value) {
      Swal.fire({ title: 'Enviando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      postAPI({ accion: 'recuperarClave', correo: res.value }).then(r => {
        Swal.close();
        if (r.exito) Swal.fire('📧 Enviada', r.mensaje, 'success');
        else Swal.fire('No encontrado', r.mensaje, 'warning');
      }).catch(() => Swal.fire('Error', 'No se pudo conectar.', 'error'));
    }
  });
}

// ==========================================
// UTILIDAD ESTÁNDAR DE PETICIONES (JSON)
// ==========================================
function postAPI(payload) {
  return fetch(API_URL, { 
    method: 'POST', 
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(r => r.json());
}
</script>
</body>
</html>
