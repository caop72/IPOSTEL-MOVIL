<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPOSTEL Móvil — Acceso</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root { --azul:#0d1b5e; --cyan:#00d2ff; }
  body { background: linear-gradient(135deg, var(--azul) 0%, #1c2f8a 100%); min-height:100vh; color:#fff; font-family:'Segoe UI',sans-serif; }
  .card-ipostel { background:#fff; color:#222; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .titulo { color: var(--azul); font-weight:700; }
  .btn-ipostel { background: var(--azul); color:#fff; font-weight:600; }
  .btn-ipostel:hover { background:#081447; color: var(--cyan); }
  .rol-card { cursor:pointer; border:2px solid #e3e6f0; border-radius:12px; transition:.2s; padding:14px; text-align:center; background:#f8f9ff; }
  .rol-card:hover { border-color: var(--cyan); transform:translateY(-2px); }
  .rol-card.activo { border-color: var(--azul); background:#e7ecff; }
  .rol-card i { font-size:1.6rem; color: var(--azul); }
  .oculto { display:none !important; }
  .badge-paso { background: var(--cyan); color:#002b40; font-weight:700; }
</style>
</head>
<body class="d-flex align-items-center py-4">
<div class="container" style="max-width: 720px;">
  <div class="card card-ipostel p-4">
    <div class="text-center mb-3">
      <h3 class="titulo mb-0">IPOSTEL Móvil</h3>
      <small class="text-muted">Sistema de control y tracking vectorial</small>
    </div>

    <!-- PASO 1: CREDENCIALES BASE -->
    <div id="paso1">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge badge-paso">Paso 1 de 4</span>
        <small class="text-muted">Identificación</small>
      </div>
      <div class="mb-2">
        <label class="form-label">Usuario</label>
        <input id="usuario" class="form-control" placeholder="Ej: mariana / Presidencia">
      </div>
      <div class="mb-2">
        <label class="form-label">Correo (si aplica)</label>
        <input id="correo" type="email" class="form-control" placeholder="correo@ipostel.gob.ve">
      </div>
      <div class="mb-3">
        <label class="form-label">Clave</label>
        <input id="clave" type="password" class="form-control" placeholder="••••">
      </div>
      <button class="btn btn-ipostel w-100" onclick="irPasoRoles()">Continuar ➜</button>
      <div class="text-center mt-2">
        <a href="#" onclick="recuperar()" class="small">¿Olvidó su clave?</a>
      </div>
    </div>

    <!-- PASO 2: ROL -->
    <div id="paso2" class="oculto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge badge-paso">Paso 2 de 4</span>
        <small class="text-muted">Seleccione su rol</small>
      </div>
      <div class="row g-2" id="gridRoles"></div>
    </div>

    <!-- PASO 3: SUB-SELECTOR -->
    <div id="paso3" class="oculto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge badge-paso">Paso 3 de 4</span>
        <small class="text-muted" id="tituloPaso3">Seleccione opción</small>
      </div>
      <div id="contenidoPaso3"></div>
      <button class="btn btn-outline-secondary w-100 mt-2" onclick="volverRoles()">⬅ Volver</button>
    </div>

    <!-- PASO 4: CLAVE EXTRA (OPT) -->
    <div id="paso4" class="oculto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge badge-paso">Paso 4 de 4</span>
        <small class="text-muted">Credenciales de la OPT</small>
      </div>
      <div class="mb-2">
        <label class="form-label">Correo</label>
        <input id="correoOPT" type="email" class="form-control" placeholder="correo@ipostel.gob.ve">
      </div>
      <div class="mb-2">
        <label class="form-label">Clave</label>
        <input id="claveOPT" type="password" class="form-control" placeholder="••••">
      </div>
      <button class="btn btn-ipostel w-100" onclick="entrarOPT()">Ingresar ➜</button>
      <button class="btn btn-outline-secondary w-100 mt-2" onclick="volverRoles()">⬅ Volver</button>
    </div>

    <!-- PASO CAMBIO DE CLAVE -->
    <div id="pasoCambio" class="oculto">
      <div class="mb-2"><span class="badge badge-paso">Cambio obligatorio</span></div>
      <p class="text-danger small mb-2">Debe establecer una clave de 4 dígitos para continuar.</p>
      <div class="mb-2">
        <label class="form-label">Nueva clave (4 dígitos)</label>
        <input id="nuevaClave" type="password" maxlength="4" inputmode="numeric" class="form-control" placeholder="••••">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar clave</label>
        <input id="confirmarClave" type="password" maxlength="4" inputmode="numeric" class="form-control" placeholder="••••">
      </div>
      <button class="btn btn-ipostel w-100" onclick="guardarClave()">Guardar y continuar ➜</button>
    </div>

  </div>
</div>

<script>
/* ⚠️ Reemplaza con tu URL /exec desplegada */
const API_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

let estadoSel = null;
let optSel = null;
let rolSel = null;
let subRolSel = null;
let usuarioPendiente = null;

const ROLES = [
  { id:'PRESIDENCIA',      label:'Presidencia',          icon:'★' },
  { id:'DESPACHO',         label:'Despacho',             icon:'✎' },
  { id:'OBSERVATORIO',     label:'Observatorio',         icon:'👁' },
  { id:'DIRECCION',        label:'Dirección',            icon:'⌂' },
  { id:'GERENCIA_ESTADO',  label:'Gerencia de Estado',   icon:'🗺' },
  { id:'COORDINADOR',      label:'Coordinador',          icon:'⚙' },
  { id:'JEFE_OPT',         label:'Jefe de OPT',          icon:'📮' },
  { id:'ANALISTA_OPT',     label:'Analista de OPT',      icon:'🔎' }
];

function post(payload) {
  return fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(r => r.json());
}

/* ---------- Paso 1 → 2 ---------- */
function irPasoRoles() {
  const u = document.getElementById('usuario').value.trim();
  const c = document.getElementById('clave').value.trim();
  const m = document.getElementById('correo').value.trim();
  if (!c) { Swal.fire('Falta','Ingrese la clave.','warning'); return; }
  usuarioPendiente = { usuario: u, correo: m, clave: c };
  renderRoles();
  document.getElementById('paso1').classList.add('oculto');
  document.getElementById('paso2').classList.remove('oculto');
}

/* ---------- Paso 2: render roles ---------- */
function renderRoles() {
  const grid = document.getElementById('gridRoles');
  grid.innerHTML = '';
  ROLES.forEach(r => {
    const col = document.createElement('div');
    col.className = 'col-6 col-md-4';
    col.innerHTML = `
      <div class="rol-card" data-rol="${r.id}">
        <div>${r.icon}</div>
        <div class="fw-semibold mt-1">${r.label}</div>
      </div>`;
    col.querySelector('.rol-card').onclick = () => elegirRol(r.id);
    grid.appendChild(col);
  });
}

/* ---------- Paso 3: condicional ---------- */
function elegirRol(rol) {
  rolSel = rol;
  document.querySelectorAll('.rol-card').forEach(el => {
    el.classList.toggle('activo', el.dataset.rol === rol);
  });

  const paso3 = document.getElementById('paso3');
  const cont  = document.getElementById('contenidoPaso3');
  const tit   = document.getElementById('tituloPaso3');
  cont.innerHTML = '';
  paso3.classList.remove('oculto');
  document.getElementById('paso2').classList.add('oculto');

  /* --- Roles de acceso directo --- */
  if (['PRESIDENCIA','DESPACHO','OBSERVATORIO'].includes(rol)) {
    entrarDirecto(rol);
    return;
  }

  /* --- Dirección --- */
  if (rol === 'DIRECCION') {
    tit.innerText = 'Seleccione área';
    cont.innerHTML = `
      <div class="row g-2">
        <div class="col-6"><div class="rol-card" data-sub="CNC">🖥<div class="fw-semibold mt-1">CNC</div><small>Micro-entrega y recepción</small></div></div>
        <div class="col-6"><div class="rol-card" data-sub="OPERACIONES">📊<div class="fw-semibold mt-1">Operaciones</div><small>Auditoría general</small></div></div>
      </div>`;
    cont.querySelectorAll('[data-sub]').forEach(el => {
      el.onclick = () => entrarSubRol(rol, el.dataset.sub);
    });
    return;
  }

  /* --- Coordinador --- */
  if (rol === 'COORDINADOR') {
    tit.innerText = 'Seleccione coordinación';
    cont.innerHTML = `
      <div class="row g-2">
        <div class="col-12"><div class="rol-card" data-sub="ENCAMINAMIENTO">🚚<div class="fw-semibold mt-1">Encaminamiento (Mariana)</div><small>Caracas → Estados</small></div></div>
        <div class="col-12"><div class="rol-card" data-sub="ALIANZA">📦<div class="fw-semibold mt-1">Control del Aliado (Alfredo)</div><small>Seguimiento MRW</small></div></div>
        <div class="col-12"><div class="rol-card" data-sub="CNC_MICRO">🔍<div class="fw-semibold mt-1">CNC-Micro Entrega (José)</div><small>Hasta el destinatario</small></div></div>
      </div>`;
    cont.querySelectorAll('[data-sub]').forEach(el => {
      el.onclick = () => entrarSubRol(rol, el.dataset.sub);
    });
    return;
  }

  /* --- Gerencia de Estado --- */
  if (rol === 'GERENCIA_ESTADO') {
    tit.innerText = 'Seleccione estado';
    cargarEstados(cont, (est) => {
      estadoSel = est;
      entrarSubRol('GERENCIA_ESTADO', null, { estado: est });
    });
    return;
  }

  /* --- Jefe de OPT / Analista de OPT --- */
  if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    tit.innerText = 'Seleccione estado';
    cargarEstados(cont, (est) => {
      estadoSel = est;
      tit.innerText = 'Seleccione OPT';
      cargarOPTs(cont, est, (opt) => {
        optSel = opt;
        document.getElementById('paso3').classList.add('oculto');
        document.getElementById('paso4').classList.remove('oculto');
      });
    });
    return;
  }
}

/* --- Cargar estados --- */
function cargarEstados(cont, cb) {
  post({ accion:'obtenerEstados' }).then(r => {
    if (!r.exito) { Swal.fire('Error', r.mensaje || 'No se pudo cargar estados', 'error'); return; }
    cont.innerHTML = '<div class="row g-2" id="listaEstados"></div>';
    const lista = document.getElementById('listaEstados');
    r.estados.forEach(est => {
      const col = document.createElement('div');
      col.className = 'col-6';
      col.innerHTML = `<div class="rol-card">${est}</div>`;
      col.querySelector('.rol-card').onclick = () => cb(est);
      lista.appendChild(col);
    });
  });
}

/* --- Cargar OPTs --- */
function cargarOPTs(cont, estado, cb) {
  post({ accion:'obtenerOPTsPorEstado', estado }).then(r => {
    if (!r.exito) { Swal.fire('Error', r.mensaje || 'No se pudo cargar OPT', 'error'); return; }
    if (!r.opts.length) { Swal.fire('Sin OPT','No hay OPT activas para ese estado.','info'); return; }
    cont.innerHTML = '<div class="row g-2" id="listaOPTs"></div>';
    const lista = document.getElementById('listaOPTs');
    r.opts.forEach(o => {
      const col = document.createElement('div');
      col.className = 'col-6';
      col.innerHTML = `<div class="rol-card"><div class="fw-semibold">${o.nombre}</div></div>`;
      col.querySelector('.rol-card').onclick = () => cb(o.codigo);
      lista.appendChild(col);
    });
  });
}

/* ---------- Entradas finales ---------- */
function entrarDirecto(rol) {
  const p = usuarioPendiente;
  post({
    accion:'loginArbol',
    rol: rol,
    usuario: p.usuario,
    correo: p.correo,
    clave: p.clave
  }).then(procesarRespuestaLogin).catch(err => Swal.fire('Error', err.message, 'error'));
}

function entrarSubRol(rol, subRol, extra) {
  const p = usuarioPendiente;
  const payload = {
    accion:'loginArbol',
    rol: rol,
    subRol: subRol || null,
    usuario: p.usuario,
    correo: p.correo,
    clave: p.clave
  };
  if (extra && extra.estado) payload.estado = extra.estado;
  post(payload).then(procesarRespuestaLogin).catch(err => Swal.fire('Error', err.message, 'error'));
}

function entrarOPT() {
  const p = usuarioPendiente;
  const correo = document.getElementById('correoOPT').value.trim();
  const clave  = document.getElementById('claveOPT').value.trim();
  if (!correo || !clave) { Swal.fire('Falta','Ingrese correo y clave.','warning'); return; }
  post({
    accion:'loginArbol',
    rol: rolSel,
    estado: estadoSel,
    codigoOPT: optSel,
    correo: correo,
    clave: clave
  }).then(procesarRespuestaLogin).catch(err => Swal.fire('Error', err.message, 'error'));
}

/* ---------- Procesar login ---------- */
function procesarRespuestaLogin(r) {
  if (!r.exito) { Swal.fire('Acceso denegado', r.mensaje || 'No autorizado', 'error'); return; }

  if (r.requiereCambio) {
    usuarioPendiente.loginResultado = r;
    document.querySelectorAll('#paso1,#paso2,#paso3,#paso4').forEach(el => el.classList.add('oculto'));
    document.getElementById('pasoCambio').classList.remove('oculto');
    return;
  }
  redirigir(r);
}

function guardarClave() {
  const n1 = document.getElementById('nuevaClave').value.trim();
  const n2 = document.getElementById('confirmarClave').value.trim();
  if (!/^\d{4}$/.test(n1)) { Swal.fire('Inválida','La clave debe tener 4 dígitos.','warning'); return; }
  if (n1 !== n2) { Swal.fire('No coincide','Las claves no coinciden.','warning'); return; }

  const r = usuarioPendiente.loginResultado || {};
  const payload = { accion:'cambiarClave', nuevaClave: n1 };
  if (r.codigoOPT) payload.codigoOPT = r.codigoOPT;
  if (r.usuario)   payload.usuario = r.usuario;
  if (usuarioPendiente.correo) payload.correo = usuarioPendiente.correo;

  post(payload).then(resp => {
    if (!resp.exito) { Swal.fire('Error', resp.mensaje, 'error'); return; }
    Swal.fire('✅ Listo','Clave actualizada.','success').then(() => redirigir(r));
  }).catch(err => Swal.fire('Error', err.message, 'error'));
}

function redirigir(r) {
  const u = encodeURIComponent(r.usuario || usuarioPendiente.usuario || '');
  const destino = r.pantalla + (r.pantalla.includes('?') ? '&' : '?') + 'u=' + u;
  window.location.href = destino;
}

/* ---------- Recuperar clave ---------- */
function recuperar() {
  const correo = document.getElementById('correo').value.trim();
  if (!correo) { Swal.fire('Correo requerido','Escriba su correo en el campo correspondiente.','info'); return; }
  post({ accion:'recuperarClave', correo }).then(r => {
    if (r.exito) Swal.fire('📧 Enviada', r.mensaje, 'success');
    else Swal.fire('No encontrado', r.mensaje, 'warning');
  });
}

/* ---------- Volver ---------- */
function volverRoles() {
  document.querySelectorAll('#paso2,#paso3,#paso4').forEach(el => el.classList.add('oculto'));
  document.getElementById('paso2').classList.remove('oculto');
  document.getElementById('paso3').innerHTML = '';
  rolSel = null; subRolSel = null; estadoSel = null; optSel = null;
}
</script>
</body>
</html>
