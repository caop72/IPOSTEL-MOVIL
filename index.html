<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPOSTEL Móvil — Acceso</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root { --azul: #0d1b5e; --cyan: #00d2ff; }
  body { background: linear-gradient(135deg, var(--azul) 0%, #1c2f8a 100%); min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', sans-serif; color: #fff; }
  .card-ipostel { background: #fff; color: #222; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); width: 100%; max-width: 500px; margin: auto; }
  .titulo { color: var(--azul); font-weight: 700; margin-bottom: 0; }
  .subtitulo { color: #6c757d; font-size: 0.9rem; }
  .btn-ipostel { background: var(--azul); color: #fff; font-weight: 600; border: none; padding: 12px; border-radius: 8px; transition: 0.3s; }
  .btn-ipostel:hover { background: #081447; color: var(--cyan); }
  .form-label { font-weight: 600; color: #444; font-size: 0.85rem; margin-bottom: 4px; }
  .form-control, .form-select { border-radius: 8px; border: 1px solid #ced4da; font-size: 0.95rem; }
  .form-control:focus, .form-select:focus { border-color: var(--cyan); box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25); }
  .oculto { display: none !important; }
  .box-clave { background: #f8f9fa; border-radius: 8px; padding: 15px; border: 1px solid #e9ecef; }
</style>
</head>
<body>
<div class="container py-4">
  <div class="card card-ipostel p-4 p-md-5">
    <div class="text-center mb-4">
      <h2 class="titulo">IPOSTEL Móvil</h2>
      <span class="subtitulo">Control y tracking vectorial de despachos</span>
    </div>

    <!-- 1. SELECTOR DE ROL -->
    <div class="mb-3">
      <label class="form-label text-primary">Seleccione su Rol</label>
      <select id="selRol" class="form-select fw-bold" onchange="cambiarRol()">
        <option value="">-- Seleccione su rol --</option>
        <option value="PRESIDENCIA">Presidencia</option>
        <option value="DESPACHO">Despacho</option>
        <option value="OBSERVATORIO">Observatorio</option>
        <option value="DIRECCION">Dirección</option>
        <option value="GERENCIA_ESTADO">Gerencia de Estado</option>
        <option value="COORDINADOR">Coordinador</option>
        <option value="JEFE_OPT">Jefe de OPT</option>
        <option value="ANALISTA_OPT">Analista de OPT</option>
      </select>
    </div>

    <div id="panelCredenciales" class="oculto">
      <!-- Acceso directo (Solo clave) -->
      <div id="boxSoloClave" class="mb-3 box-clave oculto">
        <label class="form-label">Clave de Acceso</label>
        <input id="claveDirecta" type="password" class="form-control" placeholder="••••">
      </div>

      <!-- Dirección (Sub-rol) -->
      <div id="boxSubRol" class="mb-3 oculto">
        <label class="form-label">Seleccione Dirección</label>
        <select id="selSubRol" class="form-select" onchange="cambiarSubRol()">
          <option value="">-- Seleccione --</option>
          <option value="CNC">Dirección CNC</option>
          <option value="OPERACIONES">Dirección de Operaciones</option>
        </select>
      </div>

      <!-- Coordinador (Sub-rol) -->
      <div id="boxCoord" class="mb-3 oculto">
        <label class="form-label">Seleccione Coordinación</label>
        <select id="selCoord" class="form-select" onchange="cambiarCoord()">
          <option value="">-- Seleccione --</option>
          <option value="ENCAMINAMIENTO">Encaminamiento (Mariana)</option>
          <option value="ALIANZA">Control del Aliado (Alfredo)</option>
          <option value="CNC_MICRO">CNC-Micro Entrega (José)</option>
        </select>
      </div>

      <!-- 6. PANEL DE REGISTRO (Para Gerente, Coordinador, etc.) -->
      <div id="boxCredencialesNormales" class="mb-3 oculto p-3 bg-light rounded border">
        <h6 class="text-primary mb-3 fw-bold">Datos de Registro</h6>
        <div class="mb-2">
          <label class="form-label small mb-1">Correo Electrónico</label>
          <input id="registroCorreo" type="email" class="form-control form-control-sm" placeholder="correo@ipostel.gob.ve">
        </div>
        <div class="mb-2">
          <label class="form-label small mb-1">Nombres y Apellidos</label>
          <input id="registroNombre" type="text" class="form-control form-control-sm" placeholder="Ej: Juan Pérez">
        </div>
        <div class="mb-2">
          <label class="form-label small mb-1">Cédula de Identidad</label>
          <input id="registroCedula" type="text" class="form-control form-control-sm" placeholder="Ej: V-12345678">
        </div>
        <div class="mb-0">
          <label class="form-label small mb-1">Clave de 4 dígitos</label>
          <input id="registroClave" type="password" maxlength="4" inputmode="numeric" class="form-control form-control-sm" placeholder="••••">
        </div>
      </div>

      <!-- Estado -->
      <div id="boxEstado" class="mb-3 oculto">
        <label class="form-label">Estado</label>
        <select id="selEstado" class="form-select" onchange="cambiarEstado()">
          <option value="">-- Seleccione Estado --</option>
        </select>
      </div>

      <!-- OPT -->
      <div id="boxOpt" class="mb-3 oculto">
        <label class="form-label">OPT</label>
        <select id="selOpt" class="form-select" onchange="cambiarOpt()">
          <option value="">-- Seleccione OPT --</option>
        </select>
      </div>

      <!-- Credenciales OPT (Solo correo y clave) -->
      <div id="boxCredencialesOPT" class="mb-3 box-clave oculto">
        <p class="text-primary small fw-bold mb-2">Credenciales de la OPT</p>
        <div class="mb-2">
          <input id="correoOPT" type="email" class="form-control" placeholder="Correo del Jefe/Analista">
        </div>
        <div class="mb-0">
          <input id="claveOPT" type="password" class="form-control" placeholder="Clave">
        </div>
      </div>

      <button id="btnIngresar" class="btn btn-ipostel w-100 mt-2" onclick="ingresar()">Ingresar al Sistema</button>
    </div>

    <div class="text-center mt-3">
      <a href="#" onclick="recuperar()" class="small text-decoration-none text-muted">¿Olvidó su clave?</a>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwwHyTTBHUhyG0SVqunm9hvkBMTaaQlR4xs5jbD_j8E4NRcu3YjcKG6W9WnW4DU8ZIOmA/exec';

function cambiarRol() {
  const rol = document.getElementById('selRol').value;
  
  // Ocultar todo
  document.getElementById('panelCredenciales').classList.add('oculto');
  document.getElementById('boxSoloClave').classList.add('oculto');
  document.getElementById('boxSubRol').classList.add('oculto');
  document.getElementById('boxCoord').classList.add('oculto');
  document.getElementById('boxCredencialesNormales').classList.add('oculto'); // Ocultamos correo y clave
  document.getElementById('boxEstado').classList.add('oculto');
  document.getElementById('boxOpt').classList.add('oculto');
  document.getElementById('boxCredencialesOPT').classList.add('oculto');

  if (!rol) return;
  document.getElementById('panelCredenciales').classList.remove('oculto');

  // Si es Gerencia de Estado, SOLO mostramos el desplegable de Estado
  if (rol === 'GERENCIA_ESTADO') {
    document.getElementById('boxEstado').classList.remove('oculto');
    cargarEstados();
  } 
  // Los demás roles se mantienen igual
  else if (['PRESIDENCIA', 'DESPACHO', 'OBSERVATORIO'].includes(rol)) {
    document.getElementById('boxSoloClave').classList.remove('oculto');
  } else if (rol === 'DIRECCION') {
    document.getElementById('boxSubRol').classList.remove('oculto');
  } else if (rol === 'COORDINADOR') {
    document.getElementById('boxCoord').classList.remove('oculto');
  } else if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    document.getElementById('boxEstado').classList.remove('oculto');
    cargarEstados();
  }
}

function cambiarEstado() {
  const estado = document.getElementById('selEstado').value;
  const rol = document.getElementById('selRol').value;
  
  // Si cambia o borra el estado, ocultamos correo y clave
  document.getElementById('boxCredencialesNormales').classList.add('oculto');
  document.getElementById('boxOpt').classList.add('oculto');
  document.getElementById('boxCredencialesOPT').classList.add('oculto');

  if (!estado) return;

  // Si es Gerencia de Estado y ya eligió estado, AHORA SÍ mostramos correo y clave
  if (rol === 'GERENCIA_ESTADO') {
    document.getElementById('boxCredencialesNormales').classList.remove('oculto');
  }
  
  // Si es OPT, cargamos las OPT de ese estado
  if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    cargarOPTs(estado);
  }
}
  
function cambiarSubRol() {
  if (document.getElementById('selSubRol').value) document.getElementById('boxSoloClave').classList.remove('oculto');
  else document.getElementById('boxSoloClave').classList.add('oculto');
}

function cambiarCoord() {
  if (document.getElementById('selCoord').value) document.getElementById('boxCredencialesNormales').classList.remove('oculto');
  else document.getElementById('boxCredencialesNormales').classList.add('oculto');
}

function cambiarOpt() {
  const opt = document.getElementById('selOpt').value;
  const rol = document.getElementById('selRol').value;
  if (opt && (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT')) {
    document.getElementById('boxCredencialesOPT').classList.remove('oculto');
    document.getElementById('boxCredencialesNormales').classList.add('oculto'); // Ocultamos las normales para OPT
  } else {
    document.getElementById('boxCredencialesOPT').classList.add('oculto');
  }
}

function cargarEstados() {
  fetch(API_URL, { method: 'POST', body: JSON.stringify({accion: 'obtenerEstados'}) })
  .then(r => r.json()).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selEstado');
      sel.innerHTML = '<option value="">-- Seleccione Estado --</option>';
      r.estados.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
    }
  });
}

function cargarOPTs(estado) {
  fetch(API_URL, { method: 'POST', body: JSON.stringify({accion: 'obtenerOPTsPorEstado', estado: estado}) })
  .then(r => r.json()).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selOpt');
      sel.innerHTML = '<option value="">-- Seleccione OPT --</option>';
      r.opts.forEach(o => sel.innerHTML += `<option value="${o.codigo}">${o.nombre}</option>`);
      document.getElementById('boxOpt').classList.remove('oculto');
    }
  });
}

function ingresar() {
  const rol = document.getElementById('selRol').value;
  if (!rol) { Swal.fire('Atención', 'Seleccione un rol.', 'warning'); return; }
  let payload = { accion: 'loginArbol', rol: rol };

  if (['PRESIDENCIA', 'DESPACHO', 'OBSERVATORIO'].includes(rol)) {
    const clave = document.getElementById('claveDirecta').value.trim();
    if (!clave) { Swal.fire('Atención', 'Ingrese la clave.', 'warning'); return; }
    payload.clave = clave;
  } 
  else if (rol === 'DIRECCION') {
    const subRol = document.getElementById('selSubRol').value;
    const clave = document.getElementById('claveDirecta').value.trim();
    if (!subRol) { Swal.fire('Atención', 'Seleccione la Dirección.', 'warning'); return; }
    if (!clave) { Swal.fire('Atención', 'Ingrese la clave.', 'warning'); return; }
    payload.subRol = subRol;
    payload.clave = clave;
  }
  else if (rol === 'COORDINADOR') {
    const coord = document.getElementById('selCoord').value;
    if (!coord) { Swal.fire('Atención', 'Seleccione el coordinador.', 'warning'); return; }
    payload.subRol = coord;
    payload.correo = document.getElementById('correoNormal').value.trim();
    payload.clave = document.getElementById('claveNormal').value.trim();
  }
  else if (rol === 'GERENCIA_ESTADO') {
    payload.estado = document.getElementById('selEstado').value;
    payload.correo = document.getElementById('correoNormal').value.trim();
    payload.clave = document.getElementById('claveNormal').value.trim();
  }
  else if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    payload.estado = document.getElementById('selEstado').value;
    payload.codigoOPT = document.getElementById('selOpt').value;
    payload.correo = document.getElementById('correoOPT').value.trim();
    payload.clave = document.getElementById('claveOPT').value.trim();
  }

  // Validaciones de campos vacíos
  if (['COORDINADOR', 'GERENCIA_ESTADO'].includes(rol)) {
    if (!payload.correo || !payload.clave) { Swal.fire('Atención', 'Complete correo y clave.', 'warning'); return; }
  }
  if (rol === 'GERENCIA_ESTADO' && !payload.estado) { Swal.fire('Atención', 'Seleccione un estado.', 'warning'); return; }
  if (rol.includes('OPT')) {
    if (!payload.estado || !payload.codigoOPT) { Swal.fire('Atención', 'Seleccione estado y OPT.', 'warning'); return; }
    if (!payload.correo || !payload.clave) { Swal.fire('Atención', 'Ingrese correo y clave.', 'warning'); return; }
  }

  document.getElementById('btnIngresar').disabled = true;
  document.getElementById('btnIngresar').innerText = 'Validando...';

  post(payload).then(procesarLogin).catch(err => {
    Swal.fire('Error de conexión', err.message, 'error');
    document.getElementById('btnIngresar').disabled = false;
    document.getElementById('btnIngresar').innerText = 'Ingresar al Sistema';
  });
}

function procesarLogin(r) {
  document.getElementById('btnIngresar').disabled = false;
  document.getElementById('btnIngresar').innerText = 'Ingresar al Sistema';
  if (!r.exito) { Swal.fire('Acceso denegado', r.mensaje || 'No autorizado', 'error'); return; }
  redirigir(r);
}

function redirigir(r) {
  const rol = (r.rol || document.getElementById('selRol').value || '').trim().toUpperCase();
  const usuario = r.usuario || document.getElementById('correoNormal').value || document.getElementById('correoOPT').value || '';

  sessionStorage.setItem('ipostel_rol', rol);
  sessionStorage.setItem('ipostel_usuario', usuario);
  sessionStorage.setItem('usuario', usuario);

  const rutasPorRol = {
    PRESIDENCIA: 'observatorio.html', DESPACHO: 'observatorio.html', OBSERVATORIO: 'observatorio.html',
    DIR_CNC: 'microentregas.html', DIR_OPER: 'observatorio.html',
    GERENTE_ESTADO: 'estados.html', COORD_ENCAM: 'encaminamiento.html', COORD_ALIANZA: 'seguimiento.html',
    COORD_CNC: 'coordinador_cnc.html', JEFE_OPT: 'portal_opt.html', ANALISTA_OPT: 'portal_opt.html'
  };

  let pantalla = r.pantalla;
  if (!pantalla || pantalla === 'index.html' || pantalla === '/' || pantalla.includes('github.io')) {
    pantalla = rutasPorRol[rol] || 'observatorio.html';
  }

  const destino = pantalla + (pantalla.includes('?') ? '&' : '?') + 'u=' + encodeURIComponent(usuario) + '&rol=' + encodeURIComponent(rol);
  window.location.replace(destino);
}

function recuperar() {
  Swal.fire({
    title: 'Recuperar clave', input: 'email', inputLabel: 'Escriba su correo registrado',
    inputPlaceholder: 'correo@ipostel.gob.ve', showCancelButton: true
  }).then(res => {
    if (res.isConfirmed && res.value) {
      post({ accion: 'recuperarClave', correo: res.value }).then(r => {
        if (r.exito) Swal.fire('📧 Enviada', r.mensaje, 'success');
        else Swal.fire('No encontrado', r.mensaje, 'warning');
      });
    }
  });
}

function post(payload) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
}
</script>
</body>
</html>
