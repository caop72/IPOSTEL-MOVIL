<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPOSTEL Móvil — Bienvenido</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root { 
    --azul: #0d1b5e; 
    --cyan: #00d2ff; 
  }
  
  /* Fondo de bienvenida original */
  body { 
    background: linear-gradient(135deg, var(--azul) 0%, #1c2f8a 100%); 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    font-family: 'Segoe UI', sans-serif; 
    color: #fff;
  }
  
  /* Tarjeta principal */
  .card-ipostel { 
    background: #fff; 
    color: #222;
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,.3); 
    width: 100%; 
    max-width: 520px; 
    margin: auto; 
  }
  
  .titulo { 
    color: var(--azul); 
    font-weight: 700; 
    margin-bottom: 0;
  }
  
  .subtitulo {
    color: #6c757d;
    font-size: 0.9rem;
  }

  /* Botones y estilos */
  .btn-ipostel { 
    background: var(--azul); 
    color: #fff; 
    font-weight: 600; 
    border: none; 
    padding: 12px; 
    border-radius: 8px;
    transition: 0.3s;
  }
  
  .btn-ipostel:hover { 
    background: #081447; 
    color: var(--cyan); 
  }

  .form-label { 
    font-weight: 600; 
    color: #444; 
    font-size: 0.85rem; 
    margin-bottom: 4px;
  }

  .form-control, .form-select {
    border-radius: 8px;
    border: 1px solid #ced4da;
    font-size: 0.95rem;
  }

  .form-control:focus, .form-select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25);
  }

  .oculto { display: none !important; }

  .bg-login-box {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 15px;
    border: 1px solid #e9ecef;
  }
</style>
</head>
<body>

<div class="container py-4">
  <!-- Tarjeta de Bienvenida -->
  <div class="card card-ipostel p-4 p-md-5">
    
    <div class="text-center mb-4">
      <h2 class="titulo">IPOSTEL Móvil</h2>
      <span class="subtitulo">Control y tracking vectorial de despachos</span>
    </div>

    <!-- Credenciales Generales -->
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input id="usuario" class="form-control" placeholder="Ej: mariana / Presidencia">
    </div>
    <div class="mb-3">
      <label class="form-label">Correo Electrónico</label>
      <input id="correo" type="email" class="form-control" placeholder="correo@ipostel.gob.ve">
    </div>
    <div class="mb-4">
      <label class="form-label">Clave</label>
      <input id="clave" type="password" class="form-control" placeholder="••••">
    </div>

    <hr class="text-muted mb-4">

    <!-- Selector de Rol -->
    <div class="mb-3">
      <label class="form-label text-primary">Seleccione su Rol</label>
      <select id="selRol" class="form-select fw-bold" onchange="cambiarRol()">
        <option value="">-- Seleccione su rol --</option>
        <option value="PRESIDENCIA">Presidencia</option>
        <option value="DESPACHO">Despacho</option>
        <option value="OBSERVATORIO">Observatorio</option>
        <option value="DIRECCION">Dirección</option>
        <option value="GERENCIA_ESTADO">Gerencia de Estado</option>
        <option value="COORDINADOR">Coordinador</option>
        <option value="JEFE_OPT">Jefe de OPT</option>
        <option value="ANALISTA_OPT">Analista de OPT</option>
      </select>
    </div>

    <!-- Sub-Selectores Dinámicos -->
    <div id="divSubRol" class="mb-3 oculto">
      <label class="form-label">Área / Coordinación</label>
      <select id="selSubRol" class="form-select" onchange="cambiarSubRol()">
        <option value="">-- Seleccione --</option>
      </select>
    </div>

    <div id="divEstado" class="mb-3 oculto">
      <label class="form-label">Estado</label>
      <select id="selEstado" class="form-select" onchange="cambiarEstado()">
        <option value="">-- Seleccione Estado --</option>
      </select>
    </div>

    <div id="divOpt" class="mb-3 oculto">
      <label class="form-label">OPT</label>
      <select id="selOpt" class="form-select" onchange="cambiarOpt()">
        <option value="">-- Seleccione OPT --</option>
      </select>
    </div>

    <!-- Bloque especial para OPT (Jefe/Analista) -->
    <div id="divCredencialesOPT" class="mb-3 oculto bg-login-box">
      <p class="text-primary small fw-bold mb-2">Credenciales de la OPT seleccionada</p>
      <div class="mb-2">
        <input id="correoOPT" type="email" class="form-control" placeholder="Correo del Jefe/Analista">
      </div>
      <div class="mb-0">
        <input id="claveOPT" type="password" class="form-control" placeholder="Clave inicial (1234)">
      </div>
    </div>

    <!-- Bloque de cambio de clave (Obligatorio) -->
    <div id="divCambioClave" class="mb-3 oculto bg-danger bg-opacity-10 p-3 rounded border border-danger">
      <p class="text-danger small fw-bold mb-2">⚠️ Cambio de clave obligatorio</p>
      <p class="text-muted small mb-2">Por seguridad, debe establecer una clave de 4 dígitos.</p>
      <div class="mb-2">
        <input id="nuevaClave" type="password" maxlength="4" inputmode="numeric" class="form-control" placeholder="Nueva clave (4 dígitos)">
      </div>
      <div class="mb-2">
        <input id="confirmarClave" type="password" maxlength="4" inputmode="numeric" class="form-control" placeholder="Confirmar clave">
      </div>
      <button class="btn btn-danger w-100 mt-1" onclick="guardarClave()">Guardar clave e ingresar</button>
    </div>

    <!-- Botón de Ingreso -->
    <button id="btnIngresar" class="btn btn-ipostel w-100 mt-2" onclick="ingresar()">Ingresar al Sistema</button>
    
    <div class="text-center mt-3">
      <a href="#" onclick="recuperar()" class="small text-decoration-none text-muted">¿Olvidó su clave?</a>
    </div>

  </div>
</div>

<script>
/* ⚠️ IMPORTANTE: Reemplaza esta URL con tu URL /exec de Google Apps Script */
const API_URL = 'https://script.google.com/macros/s/TU_DEPLOY_ID/exec';

let loginResultado = null;

// --- Control de Desplegables ---
function cambiarRol() {
  const rol = document.getElementById('selRol').value;
  
  // Ocultar todo por defecto
  document.getElementById('divSubRol').classList.add('oculto');
  document.getElementById('divEstado').classList.add('oculto');
  document.getElementById('divOpt').classList.add('oculto');
  document.getElementById('divCredencialesOPT').classList.add('oculto');
  document.getElementById('divCambioClave').classList.add('oculto');
  
  if (!rol) return;

  const selSubRol = document.getElementById('selSubRol');
  selSubRol.innerHTML = '<option value="">-- Seleccione --</option>';

  if (rol === 'DIRECCION') {
    document.getElementById('divSubRol').classList.remove('oculto');
    selSubRol.innerHTML += '<option value="CNC">Dirección CNC (Micro-entrega y recepción)</option>';
    selSubRol.innerHTML += '<option value="OPERACIONES">Dirección de Operaciones (Auditoría general)</option>';
  } 
  else if (rol === 'COORDINADOR') {
    document.getElementById('divSubRol').classList.remove('oculto');
    selSubRol.innerHTML += '<option value="ENCAMINAMIENTO">Encaminamiento (Mariana)</option>';
    selSubRol.innerHTML += '<option value="ALIANZA">Control del Aliado (Alfredo)</option>';
    selSubRol.innerHTML += '<option value="CNC_MICRO">CNC-Micro Entrega (José)</option>';
  }
  else if (rol === 'GERENCIA_ESTADO' || rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    document.getElementById('divEstado').classList.remove('oculto');
    cargarEstados();
  }
}

function cambiarSubRol() {
  // No requiere acción extra, solo visual
}

function cambiarEstado() {
  const estado = document.getElementById('selEstado').value;
  const rol = document.getElementById('selRol').value;
  
  document.getElementById('divOpt').classList.add('oculto');
  document.getElementById('divCredencialesOPT').classList.add('oculto');
  
  if (!estado) return;

  // Solo para OPT necesitamos cargar el siguiente nivel
  if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    cargarOPTs(estado);
  }
}

function cambiarOpt() {
  const opt = document.getElementById('selOpt').value;
  if (opt) {
    document.getElementById('divCredencialesOPT').classList.remove('oculto');
  } else {
    document.getElementById('divCredencialesOPT').classList.add('oculto');
  }
}

// --- Cargas desde Backend ---
function cargarEstados() {
  post({ accion: 'obtenerEstados' }).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selEstado');
      sel.innerHTML = '<option value="">-- Seleccione Estado --</option>';
      r.estados.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
    }
  });
}

function cargarOPTs(estado) {
  post({ accion: 'obtenerOPTsPorEstado', estado: estado }).then(r => {
    if (r.exito) {
      const sel = document.getElementById('selOpt');
      sel.innerHTML = '<option value="">-- Seleccione OPT --</option>';
      r.opts.forEach(o => sel.innerHTML += `<option value="${o.codigo}">${o.nombre}</option>`);
      document.getElementById('divOpt').classList.remove('oculto');
    } else {
      Swal.fire('Aviso', 'No hay OPT activas para este estado.', 'info');
    }
  });
}

// --- Proceso de Login ---
function ingresar() {
  const rol = document.getElementById('selRol').value;
  if (!rol) { Swal.fire('Atención', 'Debe seleccionar un rol.', 'warning'); return; }

  const usuario = document.getElementById('usuario').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const clave = document.getElementById('clave').value.trim();

  let payload = {
    accion: 'loginArbol',
    rol: rol,
    usuario: usuario,
    correo: correo,
    clave: clave
  };

  if (rol === 'DIRECCION' || rol === 'COORDINADOR') {
    const subRol = document.getElementById('selSubRol').value;
    if (!subRol) { Swal.fire('Atención', 'Seleccione la opción desplegada.', 'warning'); return; }
    payload.subRol = subRol;
  }

  if (rol === 'GERENCIA_ESTADO') {
    const estado = document.getElementById('selEstado').value;
    if (!estado) { Swal.fire('Atención', 'Seleccione un estado.', 'warning'); return; }
    payload.estado = estado;
  }

  if (rol === 'JEFE_OPT' || rol === 'ANALISTA_OPT') {
    const estado = document.getElementById('selEstado').value;
    const opt = document.getElementById('selOpt').value;
    const correoOPT = document.getElementById('correoOPT').value.trim();
    const claveOPT = document.getElementById('claveOPT').value.trim();
    
    if (!estado || !opt) { Swal.fire('Atención', 'Debe seleccionar estado y OPT.', 'warning'); return; }
    if (!correoOPT || !claveOPT) { Swal.fire('Atención', 'Ingrese correo y clave de la OPT.', 'warning'); return; }
    
    // Para OPT, sobreescribimos el correo y clave con los de su bloque
    payload.correo = correoOPT;
    payload.clave = claveOPT;
    payload.estado = estado;
    payload.codigoOPT = opt;
  }

  document.getElementById('btnIngresar').disabled = true;
  document.getElementById('btnIngresar').innerText = 'Validando...';

  post(payload).then(procesarLogin).catch(err => {
    Swal.fire('Error de conexión', err.message, 'error');
    document.getElementById('btnIngresar').disabled = false;
    document.getElementById('btnIngresar').innerText = 'Ingresar al Sistema';
  });
}

function procesarLogin(r) {
  document.getElementById('btnIngresar').disabled = false;
  document.getElementById('btnIngresar').innerText = 'Ingresar al Sistema';

  if (!r.exito) {
    Swal.fire('Acceso denegado', r.mensaje || 'No autorizado', 'error');
    return;
  }

  if (r.requiereCambio) {
    loginResultado = r;
    document.getElementById('divCambioClave').classList.remove('oculto');
    document.getElementById('btnIngresar').classList.add('oculto');
    Swal.fire('Cambio de clave', r.mensaje || 'Debe crear una clave de 4 dígitos para entrar.', 'info');
    return;
  }

  redirigir(r);
}

function guardarClave() {
  const n1 = document.getElementById('nuevaClave').value.trim();
  const n2 = document.getElementById('confirmarClave').value.trim();
  
  if (!/^\d{4}$/.test(n1)) { Swal.fire('Inválida', 'La clave debe tener 4 dígitos numéricos.', 'warning'); return; }
  if (n1 !== n2) { Swal.fire('Error', 'Las claves no coinciden.', 'warning'); return; }

  const payload = { accion: 'cambiarClave', nuevaClave: n1 };
  if (loginResultado.codigoOPT) payload.codigoOPT = loginResultado.codigoOPT;
  if (loginResultado.usuario) payload.usuario = loginResultado.usuario;
  
  if (document.getElementById('selRol').value.includes('OPT')) {
    payload.correo = document.getElementById('correoOPT').value.trim();
  } else {
    payload.correo = document.getElementById('correo').value.trim();
  }

  post(payload).then(resp => {
    if (!resp.exito) { Swal.fire('Error', resp.mensaje, 'error'); return; }
    Swal.fire('✅ Clave actualizada', 'Ingresando al sistema...', 'success').then(() => redirigir(loginResultado));
  });
}

function redirigir(r) {
  const u = encodeURIComponent(r.usuario || '');
  const destino = r.pantalla + (r.pantalla.includes('?') ? '&' : '?') + 'u=' + u;
  window.location.href = destino;
}

function recuperar() {
  const correo = document.getElementById('correo').value.trim();
  if (!correo) { Swal.fire('Atención', 'Escriba su correo en el campo primero.', 'info'); return; }
  post({ accion: 'recuperarClave', correo: correo }).then(r => {
    if (r.exito) Swal.fire('📧 Enviada', r.mensaje, 'success');
    else Swal.fire('No encontrado', r.mensaje, 'warning');
  });
}

function post(payload) {
  return fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).then(r => r.json());
}
</script>
</body>
</html>
